<!DOCTYPE html>

<style>.ver{position:fixed;bottom:6px;right:10px;font-size:11px;color:#888;opacity:.7;pointer-events:none;z-index:99}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1a24;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none}

#board-wrap{position:relative;width:100%;max-width:480px;aspect-ratio:1/1;background:#2c2c34;border-radius:12px;padding:12px;margin-bottom:12px}
#board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:4px}
.sq{position:relative;background:#3a3a44;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sq.alt{background:#34343e}

.sq .hint-dot{position:absolute;width:22px;height:22px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px #2ecc71;pointer-events:none;z-index:2;animation:hintPulse 1.2s ease-in-out infinite}
.sq .hint-cap{position:absolute;inset:4px;border:3px solid #e74c3c;border-radius:6px;box-shadow:0 0 10px #e74c3c;pointer-events:none;z-index:2;animation:hintPulse 1.2s ease-in-out infinite}
.sq .hint-rocket{position:absolute;inset:4px;border:3px dashed #ff9f43;border-radius:6px;box-shadow:0 0 10px #ff9f43;pointer-events:none;z-index:2;animation:hintPulse 1.2s ease-in-out infinite}

<body>
<div id="topbar">
  <span id="status">轮到你走棋（你是红方）</span>
  <div id="controls"><button id="btn-new">新对局</button></div>
</div>
<div id="board-wrap"><div id="board"></div></div>
<div id="captured">
  <div><div style="margin-bottom:4px">你的缴获</div><div class="cap-group" id="cap-human"></div></div>
  <div><div style="margin-bottom:4px">小miu的缴获</div><div class="cap-group" id="cap-ai"></div></div>
</div>
<div id="rules">
  <b>刀杀鸡（80-90原版）：</b><br>
  <b>走子：</b>胡蜂、癞痢、老虎、人、鸡、火箭可上下左右走1格；洋枪、刀不能自己动。<br>
  <b>拾取：</b>己方癞痢走到己方洋枪旁边→自动拾取（跟随移动，可打老虎）；己方人走到己方刀旁边→自动拾取（跟随移动，可打鸡）。主体阵亡武器一起消失。<br>
  <b>吃子：</b>胡蜂→癞痢；癞痢(有枪)→老虎；老虎→人；人(有刀)→鸡；鸡→胡蜂。<b>火箭碰谁都同归于尽。</b><br>
  <b>胜负：</b>吃光对方能动的子，或杀掉对方"人"+"癞痢"直接获胜。
</div>
<div id="toast"></div>
<div id="overlay"><div id="ov-card"><h2 id="ov-text"></h2><div><button id="btn-again">再来一局</button></div></div></div>
<script>
/* ===== 刀杀鸡 Game ===== */
var COLS=4, ROWS=4;
var PIECES=['hufeng','laili','yangqiang','laohu','ren','dao','ji','huojian'];
var NAMES={hufeng:'胡蜂',laili:'癞痢',yangqiang:'洋枪',laohu:'老虎',ren:'人',dao:'刀',ji:'鸡',huojian:'火箭'};

// Starting layout
// Row 0 (blue back): 胡蜂， 癞痢， 洋枪， 老虎
// Row 1 (blue front): 人， 刀， 鸡， 火箭
// Row 2 (red front): 火箭， 鸡， 刀， 人
// Row 3 (red back): 老虎， 洋枪， 癞痢， 胡蜂
function newState(){
  var board=[];
  for(var y=0;y<ROWS;y++){board.push([]);for(var x=0;x<COLS;x++)board[y].push(null);}
  
  var layout=[
    [['blue','hufeng'],['blue','laili'],['blue','yangqiang'],['blue','laohu']],
    [['blue','ren'],['blue','dao'],['blue','ji'],['blue','huojian']],
    [['red','huojian'],['red','ji'],['red','dao'],['red','ren']],
    [['red','laohu'],['red','yangqiang'],['red','laili'],['red','hufeng']]
  ];
  
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var c=layout[y][x][0], t=layout[y][x][1];
    var p={c:c,t:t};
    if(t==='laili')p.hasGun=false;
    if(t==='ren')p.hasKnife=false;
    board[y][x]=p;
  }
  
  return {
    board:board,
    turn:'human',
    human:'red',
    ai:'blue',
    over:false,
    winner:null,
    winReason:'',
    capHuman:[], // red's captures (blue's lost pieces)
    capAI:[],    // blue's captures (red's lost pieces)
    moveCount:0
  };
}

function inBounds(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS;}
function isWeapon(t){return t==='yangqiang'||t==='dao';}
function canMove(t){return !isWeapon(t);} // weapons cannot move on their own

// Capture logic: returns 'capture', 'rocket', or null
function captureType(att, def){
  if(!att||!def)return null;
  if(att.c===def.c)return null; // cannot capture own
  if(isWeapon(def.t))return null; // cannot capture unpicked weapons (they block)
  
  // Rocket: collides with any enemy piece, both destroyed
  if(att.t==='huojian')return 'rocket';
  // Note: if defender is rocket, it's just a normal capture? No -
  // rocket vs anything = both destroyed. So if att attacks def and def is rocket,
  // the attacker also dies? The doc says "火箭与任意棋子发生碰撞时，双方同归于尽"
  // This means whenever a rocket is involved in a collision, both die.
  // But normal captures (e.g., 老虎 eats 人） don't involve rocket.
  // If someone captures a rocket, does the attacker also die?
  // "火箭碰到任何棋子都是两败俱伤" - when rocket touches any piece, both perish.
  // I interpret: if the DEFENDER is a rocket, the attacker moving onto it triggers mutual destruction.
  if(def.t==='huojian')return 'rocket';
  
  // Normal capture chain
  if(att.t==='hufeng'&&def.t==='laili')return 'capture';
  if(att.t==='laili'&&att.hasGun&&def.t==='laohu')return 'capture';
  if(att.t==='laohu'&&def.t==='ren')return 'capture';
  if(att.t==='ren'&&att.hasKnife&&def.t==='ji')return 'capture';
  if(att.t==='ji'&&def.t==='hufeng')return 'capture';
  
  return null;
}

// Get legal moves for piece at (x,y)
function getMoves(G,x,y){
  var p=G.board[y][x];
  if(!p||!canMove(p.t))return [];
  var moves=[];
  var dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  
  for(var i=0;i<dirs.length;i++){
    var nx=x+dirs[i][0], ny=y+dirs[i][1];
    if(!inBounds(nx,ny))continue;
    var target=G.board[ny][nx];
    
    if(!target){
      moves.push({type:'move',fx:x,fy:y,tx:nx,ty:ny});
    }else if(target.c!==p.c){
      var ct=captureType(p,target);
      if(ct==='capture'){
        moves.push({type:'capture',fx:x,fy:y,tx:nx,ty:ny});
      }else if(ct==='rocket'){
        moves.push({type:'rocket',fx:x,fy:y,tx:nx,ty:ny});
      }
      // else: cannot capture, blocked
    }
    // own piece: blocked
  }
  return moves;
}

// Get all legal moves for a color
function getAllMoves(G,color){
  var moves=[];
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var p=G.board[y][x];
    if(p&&p.c===color&&canMove(p.t)){
      var ms=getMoves(G,x,y);
      for(var i=0;i<ms.length;i++)moves.push(ms[i]);
    }
  }
  return moves;
}

// Check for weapon pickup after a move
// Returns the picked up weapon piece or null
function checkPickup(G,x,y){
  var p=G.board[y][x];
  if(!p)return null;
  var dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  
  if(p.t==='laili'&&!p.hasGun){
    for(var i=0;i<dirs.length;i++){
      var nx=x+dirs[i][0], ny=y+dirs[i][1];
      if(!inBounds(nx,ny))continue;
      var n=G.board[ny][nx];
      if(n&&n.c===p.c&&n.t==='yangqiang'){
        // Pick up!
        G.board[ny][nx]=null;
        p.hasGun=true;
        return {t:'yangqiang',c:p.c};
      }
    }
  }
  if(p.t==='ren'&&!p.hasKnife){
    for(var i=0;i<dirs.length;i++){
      var nx=x+dirs[i][0], ny=y+dirs[i][1];
      if(!inBounds(nx,ny))continue;
      var n=G.board[ny][nx];
      if(n&&n.c===p.c&&n.t==='dao'){
        G.board[ny][nx]=null;
        p.hasKnife=true;
        return {t:'dao',c:p.c};
      }
    }
  }
  return null;
}

// Apply a move to state. Returns info about what happened.
function doMove(G,m){
  var p=G.board[m.fy][m.fx];
  if(!p)return null;
  
  var result={type:m.type,piece:p,pickup:null,captured:null,rocket:false};
  
  if(m.type==='move'){
    G.board[m.ty][m.tx]=p;
    G.board[m.fy][m.fx]=null;
    result.pickup=checkPickup(G,m.tx,m.ty);
  }else if(m.type==='capture'){
    var def=G.board[m.ty][m.tx];
    result.captured=def;
    // Record capture
    if(p.c==='red')G.capHuman.push({c:def.c,t:def.t});
    else G.capAI.push({c:def.c,t:def.t});
    // If defender had bound weapon, it's gone too (don't add separately)
    
    G.board[m.ty][m.tx]=p;
    G.board[m.fy][m.fx]=null;
    result.pickup=checkPickup(G,m.tx,m.ty);
  }else if(m.type==='rocket'){
    var def=G.board[m.ty][m.tx];
    result.captured=def;
    result.rocket=true;
    // Both destroyed
    // Record both as captured
    G.capHuman.push({c:def.c,t:def.t});
    G.capAI.push({c:p.c,t:p.t});
    // Note: for rocket vs rocket, both are rockets. Record accordingly.
    // Actually let's be careful: capHuman = red's captures = blue's losses
    // If red rocket hits blue piece: blue loses piece -> capHuman. Red loses rocket -> capAI.
    // The above is correct regardless of colors since p.c is the attacker's color.
    // Wait, need to fix: if p.c==='red', then def is blue.
    // capHuman (red's captures) gets def (blue's piece). capAI (blue's captures) gets p (red's rocket).
    // That's what I have. But if p.c==='blue', it's reversed.
    // Let me redo this properly below.
    
    G.board[m.ty][m.tx]=null;
    G.board[m.fy][m.fx]=null;
    // No pickup after rocket (piece is gone)
  }
  
  G.moveCount++;
  return result;
}

// Fix rocket capture recording (doMove has a bug above, let's patch it)
// Actually, I'll handle it correctly in a wrapper. Let me just fix doMove directly.
// The issue: for rocket, I pushed to capHuman/capAI without checking colors.
// Correct logic:
// - Attacker p (color p.c) and defender def (color def.c, opposite) both die.
// - p.c's opponent captures p -> if p.c==='red', then blue captures red's rocket -> capAI.push(p)
// - def.c's opponent captures def -> if def.c==='blue', then red captures blue's piece -> capHuman.push(def)
// So:
//   if(p.c==='red'){G.capHuman.push(def-as-{c,t}); G.capAI.push(p-as-{c,t});}
//   else {G.capAI.push(def); G.capHuman.push(p);}
// The code above does G.capHuman.push(def) and G.capAI.push(p) unconditionally.
// This is correct when p.c==='red', wrong when p.c==='blue'.
// I need to fix this. Let me just rewrite the rocket branch.

// Check win conditions. Returns winner color or null.
// Win if: opponent's ren AND laili are both dead, OR opponent has no movable pieces.
function checkWin(G){
  for(var color of ['red','blue']){
    var opp=color==='red'?'blue':'red';
    var hasRen=false, hasLaili=false, hasMovable=false;
    
    for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
      var p=G.board[y][x];
      if(p&&p.c===opp){
        if(p.t==='ren')hasRen=true;
        if(p.t==='laili')hasLaili=true;
        if(canMove(p.t))hasMovable=true;
      }
    }
    // Also check: unpicked weapons don't count as movable, but they're still on board.
    // hasMovable only counts non-weapon pieces.
    
    if(!hasRen&&!hasLaili){
      return {winner:color,reason:'吃掉对方"人"+"癞痢"，直接获胜！'};
    }
    if(!hasMovable){
      return {winner:color,reason:'对方无子可走，获胜！'};
    }
  }
  return null;
}

function cloneState(G){
  var nb=[];
  for(var y=0;y<ROWS;y++){nb.push([]);for(var x=0;x<COLS;x++){
    var p=G.board[y][x];
    nb[y].push(p?{c:p.c,t:p.t,hasGun:!!p.hasGun,hasKnife:!!p.hasKnife}:null);
  }}
  return {
    board:nb,turn:G.turn,human:G.human,ai:G.ai,over:G.over,winner:G.winner,
    winReason:G.winReason,capHuman:G.capHuman.slice(),capAI:G.capAI.slice(),moveCount:G.moveCount
  };
}

/* ===== AI ===== */
var aiPrevMove=null; // track AI's last move to prevent oscillation
var PIECE_VAL={ren:100,laili:100,laohu:30,ji:25,hufeng:20,huojian:25,yangqiang:15,dao:15};

function evaluate(G){
  // Positive = good for AI (blue)
  var score=0;
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var p=G.board[y][x];
    if(!p)continue;
    var v=PIECE_VAL[p.t]||10;
    if(p.hasGun)v+=40;
    if(p.hasKnife)v+=40;
    // Positional: blue wants to go down (y+), red wants to go up (y-)
    if(p.c==='blue'&&canMove(p.t))v+=y*2;
    if(p.c==='red'&&canMove(p.t))v+=(3-y)*2;
    
    if(p.c==='blue')score+=v; else score-=v;
  }
  return score;
}

function isReverseMove(m, prev){
  if(!prev)return false;
  return m.fx===prev.tx && m.fy===prev.ty && m.tx===prev.fx && m.ty===prev.fy;
}

function aiChoose(G){
  var color=G.ai;
  var moves=getAllMoves(G,color);
  if(!moves.length)return null;
  
  // 1. Check for immediate winning move
  // 2. Prioritize captures, especially of ren/laili
  // 3. Prioritize weapon pickup moves
  // 4. Use minimax for the rest
  
  var best=null, bestScore=-Infinity;
  
  // Order moves: captures first, then pickup moves, then others
  var scored=[];
  for(var i=0;i<moves.length;i++){
    var m=moves[i];
    var ns=cloneState(G);
    // Use internal doMove (need to fix rocket recording first - see below)
    doMoveFixed(ns,m);
    var w=checkWin(ns);
    var s;
    if(w&&w.winner===color){
      s=100000; // winning move
    }else if(w&&w.winner!==(color)){
      s=-100000; // avoid losing
    }else{
      s=minimax(ns,1,false,-Infinity,Infinity,color);
      // Bonus for captures
      if(m.type==='capture'){
        var def=G.board[m.ty][m.tx];
        s+=50+(PIECE_VAL[def.t]||10);
        if(def.t==='ren'||def.t==='laili')s+=200;
      }
      if(m.type==='rocket'){
        var def2=G.board[m.ty][m.tx];
        var myVal=PIECE_VAL[G.board[m.fy][m.fx].t]||10;
        var defVal=PIECE_VAL[def2.t]||10;
        if(defVal>=myVal)s+=30; // favorable trade
        else s-=20;
      }
      // Anti-oscillation: heavily penalize immediate reversal
      if(isReverseMove(m, aiPrevMove))s-=500;
    }
    scored.push({m:m,s:s});
  }
  
  // Also check: does this move pick up a weapon? (doMoveFixed doesn't tell us easily)
  // We'll add a bonus by simulating and checking hasGun/hasKnife
  for(var i=0;i<scored.length;i++){
    var m=scored[i].m;
    var p=G.board[m.fy][m.fx];
    if((p.t==='laili'&&!p.hasGun)||(p.t==='ren'&&!p.hasKnife)){
      // Check if moving here would pick up weapon
      var ns2=cloneState(G);
      doMoveFixed(ns2,m);
      var np=ns2.board[m.ty][m.tx];
      if(np&&((np.t==='laili'&&np.hasGun)||(np.t==='ren'&&np.hasKnife))){
        scored[i].s+=80; // weapon pickup bonus
      }
    }
  }
  
  scored.sort(function(a,b){return b.s-a.s;});
  return scored[0].m;
}

function minimax(G,depth,maximizing,alpha,beta,aiColor){
  var w=checkWin(G);
  if(w){
    if(w.winner===aiColor)return 10000+depth;
    else return -10000-depth;
  }
  if(depth===0)return evaluate(G);
  
  var color=maximizing?aiColor:(aiColor==='red'?'blue':'red');
  var moves=getAllMoves(G,color);
  if(!moves.length){
    // No moves = loss for the side to move? Or stalemate?
    // If you can't move, you lose (simplification)
    return maximizing?-9000:9000;
  }
  
  if(maximizing){
    var best=-Infinity;
    for(var i=0;i<moves.length;i++){
      var ns=cloneState(G);
      doMoveFixed(ns,moves[i]);
      var s=minimax(ns,depth-1,false,alpha,beta,aiColor);
      if(s>best)best=s;
      if(best>alpha)alpha=best;
      if(beta<=alpha)break;
    }
    return best;
  }else{
    var best=Infinity;
    for(var i=0;i<moves.length;i++){
      var ns=cloneState(G);
      doMoveFixed(ns,moves[i]);
      var s=minimax(ns,depth-1,true,alpha,beta,aiColor);
      if(s<best)best=s;
      if(best<beta)beta=best;
      if(beta<=alpha)break;
    }
    return best;
  }
}

// Fixed doMove that correctly records rocket captures by color
function doMoveFixed(G,m){
  var p=G.board[m.fy][m.fx];
  if(!p)return null;
  var result={type:m.type,piece:p,pickup:null,captured:null,rocket:false};
  
  if(m.type==='move'){
    G.board[m.ty][m.tx]=p;
    G.board[m.fy][m.fx]=null;
    result.pickup=checkPickup(G,m.tx,m.ty);
  }else if(m.type==='capture'){
    var def=G.board[m.ty][m.tx];
    result.captured=def;
    if(p.c==='red')G.capHuman.push({c:def.c,t:def.t});
    else G.capAI.push({c:def.c,t:def.t});
    G.board[m.ty][m.tx]=p;
    G.board[m.fy][m.fx]=null;
    result.pickup=checkPickup(G,m.tx,m.ty);
  }else if(m.type==='rocket'){
    var def=G.board[m.ty][m.tx];
    result.captured=def;
    result.rocket=true;
    // Both destroyed. Record correctly by color.
    // p.c's piece dies -> opponent of p.c captures it
    // def.c's piece dies -> opponent of def.c captures it
    if(p.c==='red'){
      G.capHuman.push({c:def.c,t:def.t}); // red captures blue's piece
      G.capAI.push({c:p.c,t:p.t});       // blue captures red's rocket
    }else{
      G.capAI.push({c:def.c,t:def.t});   // blue captures red's piece
      G.capHuman.push({c:p.c,t:p.t});    // red captures blue's rocket
    }
    G.board[m.ty][m.tx]=null;
    G.board[m.fy][m.fx]=null;
  }
  G.moveCount++;
  return result;
}

// UI uses doMoveFixed too (it handles everything correctly)
var doMoveUI=doMoveFixed;

/* ===== UI ===== */
var G, sel=null, hints=[], aiThinking=false;

function imgSrc(c,t){return 'img/'+c+'_'+t+'.png';}

function render(){
  var board=document.getElementById('board');
  board.innerHTML='';
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var sq=document.createElement('div');
    sq.className='sq'+((x+y)%2?' alt':'');
    sq.dataset.x=x; sq.dataset.y=y;
    
    var p=G.board[y][x];
    if(p){
      var img=document.createElement('img');
      img.src=imgSrc(p.c,p.t);
      img.alt=NAMES[p.t];
      sq.appendChild(img);
      // Bound weapon badge
      if((p.t==='laili'&&p.hasGun)||(p.t==='ren'&&p.hasKnife)){
        var badge=document.createElement('span');
        badge.className='bound-badge';
        badge.textContent=p.t==='laili'?'🔫':'🔪';
        sq.appendChild(badge);
      }
    }
    
    // Selection highlight
    if(sel&&sel.x===x&&sel.y===y)sq.classList.add('selected');
    
    // Hints
    for(var i=0;i<hints.length;i++){
      var h=hints[i];
      if(h.tx===x&&h.ty===y){
        var hd=document.createElement('div');
        if(h.type==='move')hd.className='hint-dot';
        else if(h.type==='capture')hd.className='hint-cap';
        else if(h.type==='rocket')hd.className='hint-rocket';
        sq.appendChild(hd);
      }
    }
    
    sq.addEventListener('click',function(){
      var x=parseInt(this.dataset.x), y=parseInt(this.dataset.y);
      onTap(x,y);
    });
    board.appendChild(sq);
  }
  
  // Status
  var st=document.getElementById('status');
  if(G.over){
    st.textContent=G.winner==='red'?'🎉 你获胜！':'😅 小miu获胜';
    st.classList.remove('thinking');
  }else if(aiThinking){
    st.textContent='小miu 思考中...';
    st.classList.add('thinking');
  }else{
    st.textContent=G.turn==='human'?'轮到你走棋（你是红方）':'轮到小miu';
    st.classList.remove('thinking');
  }
  
  renderCaptured();
}

function renderCaptured(){
  var hc=document.getElementById('cap-human');
  var ac=document.getElementById('cap-ai');
  hc.innerHTML='';ac.innerHTML='';
  for(var i=0;i<G.capHuman.length;i++){
    var img=document.createElement('img');
    img.src=imgSrc(G.capHuman[i].c,G.capHuman[i].t);
    hc.appendChild(img);
  }
  for(var i=0;i<G.capAI.length;i++){
    var img=document.createElement('img');
    img.src=imgSrc(G.capAI[i].c,G.capAI[i].t);
    ac.appendChild(img);
  }
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(function(){t.style.display='none';},2000);
}

function onTap(x,y){
  if(G.over||aiThinking)return;
  if(G.turn!=='human')return;
  var p=G.board[y][x];
  
  // Deselect if tapping selected
  if(sel&&sel.x===x&&sel.y===y){sel=null;hints=[];render();return;}
  
  // Select own piece
  if(p&&p.c===G.human&&canMove(p.t)){
    sel={x:x,y:y};
    hints=getMoves(G,x,y);
    render();
    if(!hints.length)toast(NAMES[p.t]+'没有可走的位置');
    return;
  }
  
  // Try to move to tapped square
  if(sel){
    for(var i=0;i<hints.length;i++){
      var h=hints[i];
      if(h.tx===x&&h.ty===y){
        var mover=G.board[h.fy][h.fx];
        var result=doMoveUI(G,h);
        var msg='';
        if(result.pickup){
          msg=NAMES[mover.t]+'拾取了'+NAMES[result.pickup.t]+'！';
        }
        if(result.rocket){
          msg='💥 火箭同归于尽！';
        }else if(result.captured){
          var cn=NAMES[result.captured.t];
          if(!msg)msg='吃掉了对方'+cn+'！';
          else msg+=' 吃掉'+cn+'！';
        }
        if(msg)toast(msg);
        
        sel=null;hints=[];
        
        var w=checkWin(G);
        if(w){
          G.over=true;G.winner=w.winner;G.winReason=w.reason;
          render();
          showOverlay(w.winner==='red'?'🎉 你赢了！':'😅 小miu赢了',w.reason);
          return;
        }
        
        G.turn='ai';
        render();
        setTimeout(aiMove,600);
        return;
      }
    }
    // Tapped elsewhere: deselect
    sel=null;hints=[];render();
  }
}

function aiMove(){
  if(G.over)return;
  aiThinking=true;render();
  
  setTimeout(function(){
    var m=aiChoose(G);
    aiThinking=false;
    if(!m){
      // AI has no moves - human wins
      G.over=true;G.winner='red';G.winReason='小miu无子可走！';
      render();
      showOverlay('🎉 你赢了！','小miu无子可走');
      return;
    }
    
    var mover=G.board[m.fy][m.fx];
    aiPrevMove={fx:m.fx,fy:m.fy,tx:m.tx,ty:m.ty}; // track for anti-oscillation
    var result=doMoveUI(G,m);
    
    var w=checkWin(G);
    if(w){
      G.over=true;G.winner=w.winner;G.winReason=w.reason;
      G.turn='human';
      render();
      showOverlay(w.winner==='red'?'🎉 你赢了！':'😅 小miu赢了',w.reason);
      return;
    }
    
    G.turn='human';
    render();
  },300);
}

function showOverlay(title,reason){
  document.getElementById('ov-text').textContent=title;
  if(reason){
    var rc=document.getElementById('ov-card');
    var r=rc.querySelector('.reason');
    if(!r){r=document.createElement('p');r.className='reason';r.style.cssText='font-size:14px;color:#666;margin:8px 0';rc.insertBefore(r,rc.querySelector('div'));}
    r.textContent=reason;
  }
  document.getElementById('overlay').classList.add('show');
}

function newGame(){
  G=newState();
  aiPrevMove=null;
  sel=null;hints=[];aiThinking=false;
  document.getElementById('overlay').classList.remove('show');
  render();
}

document.getElementById('btn-new').addEventListener('click',newGame);
document.getElementById('btn-again').addEventListener('click',newGame);

// Init
G=newState();
render();
</script>
<div class="ver">V1.0</div></body>
</html>
