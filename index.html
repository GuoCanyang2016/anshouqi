<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>童年游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:28px;margin-bottom:8px}
.sub{color:#888;font-size:14px;margin-bottom:40px}
.games{display:flex;flex-direction:column;gap:20px;width:100%;max-width:400px}
.game{background:#16213e;border-radius:16px;padding:24px;text-decoration:none;color:#fff;display:flex;align-items:center;gap:16px;transition:transform .2s,box-shadow .2s;border:2px solid transparent}
.game:active{transform:scale(.98)}
.game:hover{border-color:#e94560}
.icon{font-size:48px;flex-shrink:0}
.info{flex:1}
.name{font-size:20px;font-weight:bold;margin-bottom:4px}
.desc{font-size:13px;color:#aaa;line-height:1.5}
.arrow{font-size:24px;color:#e94560}
.footer{margin-top:auto;padding-top:40px;color:#555;font-size:12px}
</style>
</head>
<body>
<h1>🎮 童年游戏</h1>
<div class="sub">选一个开始玩吧</div>
<div class="games">
<a class="game" href="shouqi/">
<div class="icon">🐭</div>
<div class="info">
<div class="name">兽棋</div>
<div class="desc">翻牌对战，16张牌九宫格，老鼠钻洞，同级可换子</div>
</div>
<div class="arrow">›</div>
</a>
<a class="game" href="daoshaji/">
<div class="icon">🔪</div>
<div class="info">
<div class="name">刀杀鸡</div>
<div class="desc">80-90原版，胡蜂→癞痢→老虎→人→鸡闭环相克，火箭同归于尽</div>
</div>
<div class="arrow">›</div>
</a>
<a class="game" href="junqi/">
<div class="icon">⚔️</div>
<div class="info">
<div class="name">军棋</div>
<div class="desc">5x5翻牌对战，司令到工兵等级压制，地雷炸弹军旗</div>
</div>
<div class="arrow">›</div>
</a>
</div>
<div class="footer">你 vs 小miu · 纯前端本地运行</div>
</body>
</html>
