<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px;user-select:none;-webkit-user-select:none}
#topbar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#status{font-size:15px;color:#ffd76a;font-weight:bold}
#newgame{background:#e94560;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer}
#newgame:active{transform:scale(.96)}
#board-wrap{position:relative;width:100%;max-width:480px;aspect-ratio:1/1;background:#2c2c34;border-radius:12px;padding:6%;margin-bottom:10px}
#board{position:relative;width:100%;height:100%}
#grid-svg{position:absolute;inset:0;width:100%;height:100%}
#grid-svg line{stroke:#7a8aaa;stroke-width:2}
.pt{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
.pt img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pt.selected img{box-shadow:0 0 0 3px #ffd76a,0 2px 8px rgba(0,0,0,.5)}
.pt.card-back{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#2a4a7a,#1a2a4a);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#5a7aba;border:2px solid #3a5a8a;pointer-events:none}
.pt.card-back span{pointer-events:none}
.hint{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#2ecc71;z-index:3;pointer-events:none;box-shadow:0 0 8px #2ecc71;animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}}
.hint.cap{width:22px;height:22px;background:transparent;border:3px solid #e74c3c;box-shadow:0 0 10px #e74c3c;animation:hintPulse 1.2s ease-in-out infinite}
#captured{width:100%;max-width:480px;display:flex;justify-content:space-between;padding:8px 4px;font-size:13px;margin-top:2px}
.cap-group{display:flex;gap:3px;flex-wrap:wrap;align-items:center;max-width:45%}
.cap-group img{width:22px;height:32px;object-fit:contain;border-radius:3px}
#rules{width:100%;max-width:480px;background:#2a2a36;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.7;color:#aaa;margin-top:16px}
#rules b{color:#ffd76a}
#toast{position:fixed;left:50%;bottom:25%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:100;white-space:nowrap}
.thinking{color:#7abaff!important}
</style>

<div id="topbar">
  <div id="status">先翻一张牌（翻到哪色你就是哪方）</div>
  <button id="newgame" onclick="newGame()">新对局</button>
</div>
<div id="board-wrap"><div id="board"><svg id="grid-svg"></svg></div></div>
<div id="captured">
  <div><div style="margin-bottom:4px">你的缴获</div><div class="cap-group" id="cap-human"></div></div>
  <div><div style="margin-bottom:4px">小miu的缴获</div><div class="cap-group" id="cap-ai"></div></div>
</div>
<div id="rules">
<b>军棋（简化翻牌版）：</b><br>
<b>棋盘：</b>5×5共25个交叉点，棋子放在交叉点上。<br>
<b>翻牌：</b>开局25张牌扣着打乱，每回合可翻一张或走一步。第一张翻到哪色，你就是哪方。<br>
<b>走子：</b>除地雷、军旗外，沿线走1格。<br>
<b>大小：</b>司令&gt;军长&gt;师长&gt;旅长&gt;团长&gt;营长&gt;连长&gt;排长&gt;班长&gt;工兵，大吃小。<br>
<b>地雷：</b>不能动；任何子撞上都同归于尽，只有工兵能排雷（工兵存活）。<br>
<b>炸弹：</b>主动撞或被撞，双方同归于尽。<br>
<b>军旗：</b>不能动；被吃则直接判负（仅红方有军旗）。<br>
<b>胜负：</b>吃掉对方军旗，或吃光对方可动子。
</div>
<div id="toast"></div>

<script>
// ============ Constants ============
var COLS=5, ROWS=5;
var PIECES={
  siling:   {name:'司令', rank:10, canMove:true},
  junzhang: {name:'军长', rank:9,  canMove:true},
  shizhang: {name:'师长', rank:8,  canMove:true},
  lvzhang:  {name:'旅长', rank:7,  canMove:true},
  tuanzhang:{name:'团长', rank:6,  canMove:true},
  yingzhang:{name:'营长', rank:5,  canMove:true},
  lianzhang:{name:'连长', rank:4,  canMove:true},
  paizhang: {name:'排长', rank:3,  canMove:true},
  banzhang: {name:'班长', rank:2,  canMove:true},
  gongbing: {name:'工兵', rank:1,  canMove:true},
  dilei:    {name:'地雷', rank:0,  canMove:false},
  zhadan:   {name:'炸弹', rank:0,  canMove:true},
  junqi:    {name:'军旗', rank:0,  canMove:false}
};
// Deck: 25 cards (red 13 incl flag, blue 12 no flag)
var DECK=[
  {c:'red',t:'siling'},{c:'red',t:'junzhang'},{c:'red',t:'shizhang'},
  {c:'red',t:'lvzhang'},{c:'red',t:'tuanzhang'},{c:'red',t:'yingzhang'},
  {c:'red',t:'lianzhang'},{c:'red',t:'paizhang'},{c:'red',t:'banzhang'},
  {c:'red',t:'gongbing'},{c:'red',t:'dilei'},{c:'red',t:'zhadan'},
  {c:'red',t:'junqi'},
  {c:'blue',t:'siling'},{c:'blue',t:'junzhang'},{c:'blue',t:'shizhang'},
  {c:'blue',t:'lvzhang'},{c:'blue',t:'tuanzhang'},{c:'blue',t:'yingzhang'},
  {c:'blue',t:'lianzhang'},{c:'blue',t:'paizhang'},{c:'blue',t:'banzhang'},
  {c:'blue',t:'gongbing'},{c:'blue',t:'dilei'},{c:'blue',t:'zhadan'}
];
function imgSrc(c,t){
  if(c==='blue'&&t==='siling')return 'img/red_siling2.png';
  if(c==='blue'&&t==='junzhang')return 'img/red_junzhang2.png';
  return 'img/'+c+'_'+t+'.png';
}

// ============ State ============
var G=null, sel=null, hints=[], aiThinking=false;
function newState(){
  return {board:[],human:null,ai:null,turn:'human',over:false,winner:null,
          capHuman:[],capAI:[]};
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function newGame(){
  G=newState();
  sel=null;hints=[];aiThinking=false;
  var deck=shuffle(DECK.slice());
  var idx=0;
  for(var y=0;y<ROWS;y++){
    G.board[y]=[];
    for(var x=0;x<COLS;x++){
      var p=deck[idx++];
      G.board[y][x]={c:p.c,t:p.t,open:false};
    }
  }
  setStatus('先翻一张牌（翻到哪色你就是哪方）');
  render();
}
function setStatus(s){document.getElementById('status').textContent=s;}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._tm);
  t._tm=setTimeout(function(){t.style.display='none';},1600);
}

// ============ Coordinates ============
function px(x){return (x/(COLS-1)*100);}
function py(y){return (y/(ROWS-1)*100);}
function inB(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS;}

// ============ Capture logic ============
// Returns: 'attacker' | 'defender' | 'both' | null (cannot capture)
function captureResult(att,def){
  // att, def: {c,t}
  if(att.c===def.c)return null;
  // Bomb involved: mutual destruction
  if(att.t==='zhadan'||def.t==='zhadan')return 'both';
  // Mine as defender
  if(def.t==='dilei'){
    if(att.t==='gongbing')return 'attacker'; // engineer defuses
    return 'both'; // mine explodes, attacker dies too (simplified: both removed)
  }
  // Flag cannot be attacker (can't move); if attacked, attacker wins (game over handled separately)
  var A=PIECES[att.t], D=PIECES[def.t];
  if(A.rank>D.rank)return 'attacker';
  if(A.rank<D.rank)return 'defender';
  return 'attacker'; // equal rank: attacker wins
}

// ============ Moves ============
var DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
// Move: {type:'flip',x,y} | {type:'move',fx,fy,tx,ty} | {type:'capture',fx,fy,tx,ty,result}
function getMoves(st,x,y,color){
  var moves=[];
  var p=st.board[y][x];
  if(!p||!p.open||p.c!==color)return moves;
  if(!PIECES[p.t].canMove)return moves;
  for(var i=0;i<4;i++){
    var nx=x+DIRS[i][0],ny=y+DIRS[i][1];
    if(!inB(nx,ny))continue;
    var q=st.board[ny][nx];
    if(!q){
      moves.push({type:'move',fx:x,fy:y,tx:nx,ty:ny});
    }else if(q.open&&q.c!==color){
      var r=captureResult(p,q);
      if(r)moves.push({type:'capture',fx:x,fy:y,tx:nx,ty:ny,result:r,foe:{c:q.c,t:q.t}});
    }
    // face-down blocks
  }
  return moves;
}
function getFlips(st){
  var f=[];
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    if(st.board[y][x]&&!st.board[y][x].open)f.push({type:'flip',x:x,y:y});
  }
  return f;
}
function getAllMoves(st,color){
  var ms=getFlips(st);
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var p=st.board[y][x];
    if(p&&p.open&&p.c===color){
      ms=ms.concat(getMoves(st,x,y,color));
    }
  }
  return ms;
}

// Apply move to state. Returns info.
function doMove(st,m){
  if(m.type==='flip'){
    var p=st.board[m.y][m.x];
    p.open=true;
    return {flipped:{c:p.c,t:p.t}};
  }
  var att=st.board[m.fy][m.fx];
  if(m.type==='move'){
    st.board[m.ty][m.tx]=att;
    st.board[m.fy][m.fx]=null;
    return {};
  }
  if(m.type==='capture'){
    var def=st.board[m.ty][m.tx];
    var r=m.result;
    if(r==='both'){
      st.board[m.ty][m.tx]=null;
      st.board[m.fy][m.fx]=null;
      return {bothDead:true,attPiece:{c:att.c,t:att.t},defPiece:{c:def.c,t:def.t}};
    }else if(r==='attacker'){
      st.board[m.ty][m.tx]=att;
      st.board[m.fy][m.fx]=null;
      return {captured:{c:def.c,t:def.t}};
    }else{ // defender wins
      st.board[m.fy][m.fx]=null;
      return {attackerDead:{c:att.c,t:att.t}};
    }
  }
}
function _doMove(st,m){return doMove(st,m);} // alias for AI

function cloneState(st){
  var ns={board:[],human:st.human,ai:st.ai,turn:st.turn,over:st.over,winner:st.winner,
           capHuman:st.capHuman.slice(),capAI:st.capAI.slice()};
  for(var y=0;y<ROWS;y++){
    ns.board[y]=[];
    for(var x=0;x<COLS;x++){
      var p=st.board[y][x];
      ns.board[y][x]=p?{c:p.c,t:p.t,open:p.open}:null;
    }
  }
  return ns;
}

// ============ Win check ============
// Returns winner color or null
function checkWin(st){
  // Flag captured?
  var redFlag=false, blueFlag=false;
  var redMovable=0, blueMovable=0;
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var p=st.board[y][x];
    if(!p)continue;
    if(p.t==='junqi'&&p.open){
      if(p.c==='red')redFlag=true;else blueFlag=true;
    }
    if(p.open&&PIECES[p.t].canMove){
      if(p.c==='red')redMovable++;else blueMovable++;
    }
  }
  // Red flag captured (flag gone from board) -> blue wins
  // Note: flag starts on board, so if red's flag is not on board and game has started, it's captured
  // We track via: if human/ai colors assigned and flag missing
  return {redFlag:redFlag,blueFlag:blueFlag,redMovable:redMovable,blueMovable:blueMovable};
}
// Track if flag was ever on board (to detect capture vs not-yet-flipped)
var flagOnBoard={red:true,blue:false}; // blue has no flag in this deck

function updateWinState(st){
  var w=checkWin(st);
  // Red flag captured?
  if(st.human||st.ai){ // colors assigned
    // Check if red flag is gone (was on board, now not)
    // Simpler: count flags. Red should have 1. If 0 and at least one flip happened, it's captured.
    var redFlagCount=0;
    for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
      var p=st.board[y][x];
      if(p&&p.t==='junqi'&&p.c==='red')redFlagCount++;
    }
    // If red flag not on board AND red flag was flipped before (open), it's captured
    // Actually simpler: if any capture removed a junqi, we detect in doMove wrapper
  }
  // Elimination: no movable pieces
  if(w.redMovable===0&&w.blueMovable===0){
    st.over=true;st.winner='draw';
  }else if(w.redMovable===0){
    st.over=true;st.winner='blue';
  }else if(w.blueMovable===0){
    st.over=true;st.winner='red';
  }
}

// ============ UI: render ============
function render(){
  drawGrid();
  var boardEl=document.getElementById('board');
  // Remove old pieces and hints (keep svg)
  var olds=boardEl.querySelectorAll('.pt,.hint');
  for(var i=0;i<olds.length;i++)olds[i].remove();
  var cardW=17; // % width, smaller for 5x5
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var p=G.board[y][x];
    if(!p)continue;
    var d=document.createElement('div');
    d.className='pt';
    if(sel&&sel.x===x&&sel.y===y)d.classList.add('selected');
    d.style.left=px(x)+'%';d.style.top=py(y)+'%';
    d.style.width=cardW+'%';
    d.style.zIndex='2';
    if(!p.open){
      d.classList.add('card-back');
      d.innerHTML='<span>军</span>';
      d.style.aspectRatio='3/4';
    }else{
      var img=document.createElement('img');
      img.src=imgSrc(p.c,p.t);
      img.alt=PIECES[p.t].name;
      img.draggable=false;
      d.appendChild(img);
    }
    (function(xx,yy){
      d.addEventListener('click',function(e){e.stopPropagation();onTap(xx,yy);});
    })(x,y);
    boardEl.appendChild(d);
  }
  // Hints
  for(var h=0;h<hints.length;h++){
    var hm=hints[h];
    var hd=document.createElement('div');
    hd.className='hint'+(hm.type==='capture'?' cap':'');
    hd.style.left=px(hm.tx)+'%';hd.style.top=py(hm.ty)+'%';
    boardEl.appendChild(hd);
  }
  renderCaptured();
  // Board background click for empty intersections
  // (handled via delegated listener attached once)
}
function drawGrid(){
  var svg=document.getElementById('grid-svg');
  svg.innerHTML='';
  var NS='http://www.w3.org/2000/svg';
  for(var x=0;x<COLS;x++){
    var l=document.createElementNS(NS,'line');
    l.setAttribute('x1',px(x));l.setAttribute('y1',py(0));
    l.setAttribute('x2',px(x));l.setAttribute('y2',py(ROWS-1));
    svg.appendChild(l);
  }
  for(var y=0;y<ROWS;y++){
    var l2=document.createElementNS(NS,'line');
    l2.setAttribute('x1',px(0));l2.setAttribute('y1',py(y));
    l2.setAttribute('x2',px(COLS-1));l2.setAttribute('y2',py(y));
    svg.appendChild(l2);
  }
}
function renderCaptured(){
  var hc=document.getElementById('cap-human');
  var ac=document.getElementById('cap-ai');
  hc.innerHTML='';ac.innerHTML='';
  if(!G.human)return;
  for(var i=0;i<G.capHuman.length;i++){
    var p=G.capHuman[i];
    var img=document.createElement('img');
    img.src=imgSrc(p.c,p.t);
    hc.appendChild(img);
  }
  for(var j=0;j<G.capAI.length;j++){
    var q=G.capAI[j];
    var img2=document.createElement('img');
    img2.src=imgSrc(q.c,q.t);
    ac.appendChild(img2);
  }
}
function recordCapture(loserC,loserT,winnerIsHuman){
  if(winnerIsHuman)G.capHuman.push({c:loserC,t:loserT});
  else G.capAI.push({c:loserC,t:loserT});
}

// ============ UI: interaction ============
function onTap(x,y){
  if(!G||G.over||aiThinking)return;
  if(G.turn!=='human')return;
  var c=G.board[y][x];
  // Flip face-down
  if(c&&!c.open){
    var info=doMove(G,{type:'flip',x:x,y:y});
    // First flip sets colors
    if(!G.human){
      G.human=info.flipped.c;
      G.ai=(G.human==='red'?'blue':'red');
      toast('你是'+(G.human==='red'?'红':'蓝')+'方');
    }
    afterHumanMove();
    return;
  }
  // Deselect
  if(sel&&sel.x===x&&sel.y===y){sel=null;hints=[];render();return;}
  // Select own piece
  if(c&&c.open&&G.human&&c.c===G.human&&PIECES[c.t].canMove){
    sel={x:x,y:y};
    hints=getMoves(G,x,y,G.human);
    render();
    if(!hints.length)toast('这张牌没有可走的位置');
    return;
  }
  // Try move to tapped hint
  if(sel){
    for(var i=0;i<hints.length;i++){
      var h=hints[i];
      if(h.tx===x&&h.ty===y){
        executeHumanMove(h);
        return;
      }
    }
    sel=null;hints=[];render();
  }
}
function executeHumanMove(h){
  var info;
  if(h.type==='capture'){
    var defPiece={c:G.board[h.ty][h.tx].c,t:G.board[h.ty][h.tx].t};
    info=doMove(G,h);
    if(h.result==='attacker'){
      recordCapture(defPiece.c,defPiece.t,true);
    }else if(h.result==='both'){
      recordCapture(defPiece.c,defPiece.t,true);
      recordCapture(G.human,h.foe?getAttType(h):'',true); // attacker also dead, goes to AI's captures
      // Simpler: attacker's piece also captured by AI
    }else{ // defender wins, attacker dead
      // attacker's piece goes to AI captures
    }
    // Handle flag capture
    if(defPiece.t==='junqi'){
      G.over=true;G.winner=G.human;
    }
    // Bomb mutual: attacker also dead
    if(h.result==='both'){
      // attacker's piece type
      var attT=G.board[h.fy]&&G.board[h.fy][h.fx]?null:null; // already removed
    }
  }else{
    info=doMove(G,h);
  }
  // Fix capture recording for 'both' and 'defender' cases
  sel=null;hints=[];
  updateWinState(G);
  render();
  if(G.over){endGame();return;}
  afterHumanMove();
}
// Simpler capture recording: recompute from move
function executeHumanMove2(h){
  var attP={c:G.board[h.fy][h.fx].c,t:G.board[h.fy][h.fx].t};
  var defP=h.type==='capture'?{c:G.board[h.ty][h.tx].c,t:G.board[h.ty][h.tx].t}:null;
  var info=doMove(G,h);
  if(h.type==='capture'){
    if(h.result==='attacker'){
      recordCapture(defP.c,defP.t,true);
      if(defP.t==='junqi'){G.over=true;G.winner=G.human;}
    }else if(h.result==='both'){
      recordCapture(defP.c,defP.t,true);   // defender goes to human's captures
      recordCapture(attP.c,attP.t,false);  // attacker goes to AI's captures
    }else{ // defender wins
      recordCapture(attP.c,attP.t,false);  // attacker goes to AI's captures
    }
  }
  sel=null;hints=[];
  updateWinState(G);
  render();
  if(G.over){endGame();return;}
  G.turn='ai';
  setStatus('小miu 思考中...');
  aiThinking=true;
  setTimeout(aiMove,400);
}
// Use the correct one
executeHumanMove=executeHumanMove2;

function afterHumanMove(){
  updateWinState(G);
  render();
  if(G.over){endGame();return;}
  // If colors not yet assigned (no flip yet), stay human turn
  G.turn='ai';
  // AI only moves if colors assigned; otherwise AI just flips
  setStatus('小miu 思考中...');
  setStatus(document.getElementById('status').textContent);
  aiThinking=true;
  var st=document.getElementById('status');
  st.classList.add('thinking');
  setTimeout(aiMove,400);
}
function endGame(){
  aiThinking=false;
  var msg;
  if(G.winner==='draw')msg='平局！';
  else if(G.winner===G.human)msg='🎉 你赢了！';
  else msg='小miu 赢了，再接再厉！';
  setStatus(msg);
  document.getElementById('status').classList.remove('thinking');
  toast(msg);
}

// ============ AI ============
function evaluate(st,aiColor){
  var score=0;
  var vals={siling:100,junzhang:90,shizhang:80,lvzhang:70,tuanzhang:60,
            yingzhang:50,lianzhang:40,paizhang:30,banzhang:20,gongbing:15,
            dilei:25,zhadan:35,junqi:1000};
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var p=st.board[y][x];
    if(!p||!p.open)continue;
    var v=vals[p.t]||10;
    if(p.c===aiColor)score+=v;else score-=v;
  }
  return score;
}
function aiChoose(st,aiColor){
  var moves=getAllMoves(st,aiColor);
  if(!moves.length)return null;
  var flips=moves.filter(function(m){return m.type==='flip';});
  var actions=moves.filter(function(m){return m.type!=='flip';});
  var curEval=evaluate(st,aiColor);
  var best=null,bestScore=-Infinity,bestGain=-Infinity;
  for(var i=0;i<actions.length;i++){
    var m=actions[i];
    var ns=cloneState(st);
    _doMove(ns,m);
    var s=evaluate(ns,aiColor);
    if(m.type==='capture'){
      var foeVal={siling:100,junzhang:90,shizhang:80,lvzhang:70,tuanzhang:60,
                  yingzhang:50,lianzhang:40,paizhang:30,banzhang:20,gongbing:15,
                  dilei:25,zhadan:10,junqi:1000}[m.foe.t]||10;
      s+=foeVal*0.5;
      if(m.foe.t==='junqi')s+=5000;
      if(m.result==='both')s-=30;
      if(m.result==='defender')s-=200;
    }
    s+=Math.random()*2;
    var gain=s-curEval;
    if(s>bestScore){bestScore=s;best=m;bestGain=gain;}
  }
  // Good capture (positive material gain, not suicide): always take it
  if(best&&best.type==='capture'&&best.result==='attacker'&&bestGain>5){
    return best;
  }
  // Early game: flip to reveal more pieces
  var openCount=0;
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)
    if(st.board[y][x]&&st.board[y][x].open)openCount++;
  if(flips.length&&openCount<10&&(!best||bestGain<20)){
    return flips[Math.floor(Math.random()*flips.length)];
  }
  return best||flips[0];
}
function aiMove(){
  if(!G||G.over){aiThinking=false;return;}
  var m=aiChoose(G,G.ai||'blue');
  // If colors not assigned yet, AI color defaults to opposite of future human
  // Actually AI flips too; first flip by AI sets human to opposite
  if(m){
    if(m.type==='flip'){
      var info=doMove(G,m);
      if(!G.human){
        // AI flipped first: AI is that color, human is opposite
        G.ai=info.flipped.c;
        G.human=(G.ai==='red'?'blue':'red');
        toast('你是'+(G.human==='red'?'红':'蓝')+'方');
      }
    }else{
      var attP={c:G.board[m.fy][m.fx].c,t:G.board[m.fy][m.fx].t};
      var defP=m.type==='capture'?{c:G.board[m.ty][m.tx].c,t:G.board[m.ty][m.tx].t}:null;
      doMove(G,m);
      if(m.type==='capture'){
        if(m.result==='attacker'){
          recordCapture(defP.c,defP.t,false);
          if(defP.t==='junqi'){G.over=true;G.winner=G.ai;}
        }else if(m.result==='both'){
          recordCapture(defP.c,defP.t,false);
          recordCapture(attP.c,attP.t,true);
        }else{
          recordCapture(attP.c,attP.t,true);
        }
      }
    }
  }
  updateWinState(G);
  aiThinking=false;
  document.getElementById('status').classList.remove('thinking');
  render();
  if(G.over){endGame();return;}
  G.turn='human';
  if(G.human)setStatus('轮到你走棋（你是'+(G.human==='red'?'红':'蓝')+'方）');
  else setStatus('先翻一张牌（翻到哪色你就是哪方）');
}

// ============ Board click delegation (empty intersections) ============
document.getElementById('board').addEventListener('click',function(e){
  if(e.target.closest('.pt')||e.target.closest('.hint'))return;
  // Calculate grid from click position
  var rect=this.getBoundingClientRect();
  // Account for padding: board is inset by 6% padding of wrap
  var fx=(e.clientX-rect.left)/rect.width;
  var fy=(e.clientY-rect.top)/rect.height;
  var x=Math.round(fx*(COLS-1));
  var y=Math.round(fy*(ROWS-1));
  if(inB(x,y))onTap(x,y);
});

// ============ Init ============
document.getElementById('newgame').addEventListener('click',newGame);
newGame();
</script>
