<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>弹球掉梯子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none}
#wrap{position:relative;width:100%;max-width:420px}
#cv{display:block;width:100%;background:linear-gradient(#16213e,#0f0f23);border-radius:12px;touch-action:none}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:16px;font-weight:bold;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);border-radius:12px;z-index:10}
#overlay h2{font-size:26px;margin-bottom:12px}
#overlay p{font-size:14px;color:#aaa;margin-bottom:20px;line-height:1.8;text-align:center;padding:0 30px}
#btn-start{background:#e94560;color:#fff;border:none;border-radius:12px;padding:14px 48px;font-size:18px;font-weight:bold;cursor:pointer}
#btn-start:active{transform:scale(.96)}
.hidden{display:none!important}
#back{margin-top:14px;color:#888;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="400" height="600"></canvas>
  <div id="hud"><span id="hud-score">0 层</span><span id="hud-life">❤❤❤</span></div>
  <div id="overlay">
    <h2>🔴 弹球掉梯子</h2>
    <p>小球往下掉，左右拖动让它落在梯子上<br>掉空扣一条命，吃到金球加一条命<br>越掉越快，能撑多少层？</p>
    <button id="btn-start">开始</button>
  </div>
</div>
<a id="back" href="../">← 回童年游戏</a>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=400,H=600;
var G={
  state:'ready', // ready | play | over
  score:0, life:3, maxLife:5,
  speed:1, // falls faster over time
  ball:{x:W/2,y:80,r:12,vy:0,vx:0},
  ladders:[], // {x,w,y,gold:{x,y,taken}}
  targetX:null, // finger x for drag control
  keys:{l:false,r:false}
};
var LADDER_W=86, LADDER_H=12, GAP=110;

function reset(){
  G.score=0;G.life=3;G.speed=1;
  G.ball={x:W/2,y:80,r:12,vy:0,vx:0};
  G.ladders=[];
  G.targetX=null;
  // first ladder under the ball
  G.ladders.push({x:W/2,y:200,w:LADDER_W,gold:null});
  var y=200+GAP;
  while(y<H+40){
    addLadder(y);
    y+=GAP;
  }
  updateHUD();
}
function addLadder(y){
  var w=LADDER_W*(0.9+Math.random()*0.3);
  var x=w/2+Math.random()*(W-w);
  var gold=null;
  if(Math.random()<0.35){
    gold={x:x+(Math.random()-0.5)*w*0.7,y:y-22,taken:false};
  }
  G.ladders.push({x:x,y:y,w:w,gold:gold});
}
function updateHUD(){
  document.getElementById('hud-score').textContent=G.score+' 层';
  var s='';
  for(var i=0;i<G.maxLife;i++)s+=i<G.life?'❤':'🖤';
  document.getElementById('hud-life').textContent=s;
}
function loseLife(){
  G.life--;
  updateHUD();
  if(G.life<=0){
    G.state='over';
    showOver();
  }else{
    // respawn on the highest ladder
    var top=G.ladders[0];
    for(var i=1;i<G.ladders.length;i++)if(G.ladders[i].y<top.y)top=G.ladders[i];
    G.ball.x=top.x;G.ball.y=top.y-30;G.ball.vy=0;G.ball.vx=0;
  }
}
function showOver(){
  var ov=document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML='<h2>游戏结束</h2><p>掉了 '+G.score+' 层<br>再来一次？</p><button id="btn-start">再来</button>';
  document.getElementById('btn-start').addEventListener('click',start);
}
function start(){
  document.getElementById('overlay').classList.add('hidden');
  reset();
  G.state='play';
}
// Controls: drag / keys
function ptrX(e){
  var r=cv.getBoundingClientRect();
  var cx=(e.touches?e.touches[0].clientX:e.clientX);
  return (cx-r.left)/r.width*W;
}
cv.addEventListener('pointerdown',function(e){G.targetX=ptrX(e);});
cv.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')G.targetX=ptrX(e);});
window.addEventListener('pointerup',function(){G.targetX=null;});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')G.keys.l=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')G.keys.r=true;
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')G.keys.l=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')G.keys.r=false;
});
document.getElementById('btn-start').addEventListener('click',start);

var last=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(t-last)/1000||0.016);
  last=t;
  if(G.state!=='play')return;
  var b=G.ball;
  // horizontal control
  var moveV=0;
  if(G.targetX!==null){
    var dx=G.targetX-b.x;
    moveV=Math.max(-340,Math.min(340,dx*8));
  }else{
    if(G.keys.l)moveV-=280;
    if(G.keys.r)moveV+=280;
  }
  b.vx+=(moveV-b.vx)*Math.min(1,dt*10);
  b.x+=b.vx*dt;
  if(b.x<b.r){b.x=b.r;b.vx=0;}
  if(b.x>W-b.r){b.x=W-b.r;b.vx=0;}
  // gravity (speeds up with score)
  var grav=900+G.score*14;
  b.vy+=grav*dt;
  if(b.vy>620)b.vy=620;
  b.y+=b.vy*dt;
  // world scroll: keep ball in upper 2/3, move ladders up as ball descends
  var i,L,landed=false;
  for(i=0;i<G.ladders.length;i++){
    L=G.ladders[i];
    // landing check: ball falling onto ladder top
    if(b.vy>0&&
       b.y+b.r>=L.y&&b.y+b.r<=L.y+LADDER_H+14&&
       Math.abs(b.x-L.x)<=L.w/2){
      b.y=L.y-b.r;
      b.vy=-260; // small bounce
      G.score++;
      G.speed=1+G.score*0.02;
      // gold?
      if(L.gold&&!L.gold.taken&&Math.abs(b.x-L.gold.x)<26){
        L.gold.taken=true;
        if(G.life<G.maxLife){G.life++;updateHUD();}
        G.score+=2;
      }
      updateHUD();
      landed=true;
      break;
    }
    // gold collect even without landing (touch)
    if(L.gold&&!L.gold.taken&&Math.hypot(b.x-L.gold.x,b.y-L.gold.y)<b.r+10){
      L.gold.taken=true;
      if(G.life<G.maxLife){G.life++;updateHUD();}
    }
  }
  // scroll ladders up when ball goes below mid
  if(b.y>H*0.55){
    var dy=b.y-H*0.55;
    b.y=H*0.55;
    for(i=G.ladders.length-1;i>=0;i--){
      G.ladders[i].y-=dy;
      if(G.ladders[i].gold)G.ladders[i].gold.y-=dy;
      if(G.ladders[i].y<-30)G.ladders.splice(i,1);
    }
  }
  // add new ladders at bottom
  var maxY=0;
  for(i=0;i<G.ladders.length;i++)if(G.ladders[i].y>maxY)maxY=G.ladders[i].y;
  while(maxY<H+40){maxY+=GAP;addLadder(maxY);}
  // fell through everything
  if(b.y>H+30){
    loseLife();
    return;
  }
  draw();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var i,L;
  // ladders
  for(i=0;i<G.ladders.length;i++){
    L=G.ladders[i];
    ctx.fillStyle='#e94560';
    ctx.beginPath();
    ctx.roundRect(L.x-L.w/2,L.y,L.w,LADDER_H,6);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.fillRect(L.x-L.w/2+4,L.y+2,L.w-8,3);
    if(L.gold&&!L.gold.taken){
      ctx.fillStyle='#ffd700';
      ctx.beginPath();
      ctx.arc(L.gold.x,L.gold.y,9,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#fff8';
      ctx.beginPath();
      ctx.arc(L.gold.x-3,L.gold.y-3,3,0,Math.PI*2);
      ctx.fill();
    }
  }
  // ball
  var b=G.ball;
  var grd=ctx.createRadialGradient(b.x-4,b.y-4,2,b.x,b.y,b.r);
  grd.addColorStop(0,'#ff8a8a');grd.addColorStop(1,'#d92638');
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fill();
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
