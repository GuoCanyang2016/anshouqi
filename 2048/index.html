<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #faf8ef; color: #776e65;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 52px; font-weight: bold; color: #776e65; }
  .scores { display: flex; gap: 8px; }
  .score-box { background: #bbada0; color: #fff; border-radius: 6px; padding: 6px 14px; text-align: center; min-width: 76px; }
  .score-box .label { font-size: 11px; color: #eee4da; text-transform: uppercase; }
  .score-box .value { font-size: 20px; font-weight: bold; }
  .toolbar { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toolbar p { font-size: 14px; color: #776e65; }
  .btn { background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px; padding: 10px 18px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn:active { background: #7f6a56; }
  #board {
    width: 100%; max-width: 440px; aspect-ratio: 1;
    background: #bbada0; border-radius: 10px; padding: 10px;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px;
    position: relative;
  }
  .cell { background: rgba(238, 228, 218, 0.35); border-radius: 6px; }
  .tile {
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: bold; z-index: 2;
    transition: transform 0.12s ease-in-out;
  }
  .tile.new { animation: pop 0.18s ease; }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .t2    { background: #eee4da; color: #776e65; }
  .t4    { background: #ede0c8; color: #776e65; }
  .t8    { background: #f2b179; color: #f9f6f2; }
  .t16   { background: #f59563; color: #f9f6f2; }
  .t32   { background: #f67c5f; color: #f9f6f2; }
  .t64   { background: #f65e3b; color: #f9f6f2; }
  .t128  { background: #edcf72; color: #f9f6f2; }
  .t256  { background: #edcc61; color: #f9f6f2; }
  .t512  { background: #edc850; color: #f9f6f2; }
  .t1024 { background: #edc53f; color: #f9f6f2; }
  .t2048 { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 20px rgba(237,194,46,.6); }
  .tsuper{ background: #3c3a32; color: #f9f6f2; }
  .dpad { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(2, 46px); gap: 8px; justify-content: center; margin-top: 14px; }
  .dpad button { background: #ede0c8; color: #776e65; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; }
  .dpad button:active { background: #d8c8a8; }
  #overlay {
    position: fixed; inset: 0; background: rgba(238,228,218,.73);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #overlay.show { display: flex; }
  .msg { text-align: center; }
  .msg h2 { font-size: 48px; margin-bottom: 16px; }
  .hint { margin-top: 18px; font-size: 13px; color: #a29382; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">最高</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="toolbar">
    <p>合并数字，冲到 <b>2048</b>！</p>
    <button class="btn" id="restart">新游戏</button>
  </div>
  <div id="board"></div>
  <div class="dpad">
    <span></span><button data-d="1">▲</button><span></span>
    <button data-d="0">◀</button><button data-d="3">▼</button><button data-d="2">▶</button>
  </div>
  <div id="overlay"><div class="msg"><h2 id="msg-title"></h2><button class="btn" id="again">再来一局</button></div></div>
  <p class="hint">电脑用方向键 / WASD 操作<br>手机上直接滑动屏幕</p>

<script>
(function(){
  var SIZE = 4;
  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var msgTitle = document.getElementById('msg-title');
  var grid, score, best, won, over;

  best = parseInt(localStorage.getItem('best2048') || '0', 10);
  bestEl.textContent = best;

  // build background cells
  for (var i = 0; i < 16; i++) {
    var c = document.createElement('div');
    c.className = 'cell';
    board.appendChild(c);
  }

  function emptyCells(g) {
    var cells = [];
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++)
      if (!g[r][c]) cells.push([r, c]);
    return cells;
  }

  function addRandomTile(g, animate) {
    var cells = emptyCells(g);
    if (!cells.length) return;
    var pick = cells[Math.floor(Math.random() * cells.length)];
    var tile = { v: Math.random() < 0.9 ? 2 : 4, isNew: !!animate, merged: false };
    g[pick[0]][pick[1]] = tile;
  }

  function newGame() {
    grid = [];
    for (var r = 0; r < SIZE; r++) { grid.push([]); for (var c = 0; c < SIZE; c++) grid[r].push(null); }
    score = 0; won = false; over = false;
    overlay.classList.remove('show');
    addRandomTile(grid, false);
    addRandomTile(grid, false);
    draw();
  }

  function draw() {
    // clear old tiles
    var olds = board.querySelectorAll('.tile');
    for (var i = 0; i < olds.length; i++) olds[i].remove();
    var cellW = board.clientWidth;
    var gap = 10, pad = 10;
    var tileSize = (cellW - pad * 2 - gap * (SIZE - 1)) / SIZE;
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      var t = grid[r][c];
      if (!t) continue;
      var el = document.createElement('div');
      var cls = t.v > 2048 ? 'tsuper' : 't' + t.v;
      el.className = 'tile ' + cls + (t.isNew ? ' new' : '');
      el.textContent = t.v;
      var fs = t.v < 100 ? tileSize * 0.45 : t.v < 1000 ? tileSize * 0.38 : tileSize * 0.3;
      el.style.fontSize = fs + 'px';
      el.style.width = tileSize + 'px';
      el.style.height = tileSize + 'px';
      el.style.position = 'absolute';
      el.style.left = (pad + c * (tileSize + gap)) + 'px';
      el.style.top = (pad + r * (tileSize + gap)) + 'px';
      board.appendChild(el);
      t.isNew = false;
    }
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('best2048', best); }
  }

  function slideRow(row) {
    var arr = row.filter(function(t){ return t; });
    var merged = [];
    var gained = 0;
    for (var i = 0; i < arr.length; i++) {
      if (i + 1 < arr.length && arr[i].v === arr[i+1].v) {
        var nv = arr[i].v * 2;
        merged.push({ v: nv, isNew: false, merged: true });
        gained += nv;
        i++;
      } else {
        merged.push({ v: arr[i].v, isNew: false, merged: false });
      }
    }
    while (merged.length < SIZE) merged.push(null);
    return { row: merged, gained: gained };
  }

  function rotate(g) { // clockwise
    var n = [];
    for (var r = 0; r < SIZE; r++) { n.push([]); for (var c = 0; c < SIZE; c++) n[r].push(g[SIZE-1-c][r]); }
    return n;
  }

  function rowsEqual(r1, r2) {
    for (var c = 0; c < SIZE; c++) {
      var x = r1[c] ? r1[c].v : 0, y = r2[c] ? r2[c].v : 0;
      if (x !== y) return false;
    }
    return true;
  }

  // dir: 0=left, 1=up, 2=right, 3=down
  // rotate() is clockwise; to turn a move into "slide left":
  // up needs 3 CW turns, right needs 2, down needs 1, left needs 0
  function move(dir) {
    if (over) return;
    var g = grid;
    var fwd = (4 - dir) % 4;
    for (var i = 0; i < fwd; i++) g = rotate(g);
    var moved = false, gained = 0;
    var ng = [];
    for (var r = 0; r < SIZE; r++) {
      var res = slideRow(g[r]);
      ng.push(res.row);
      gained += res.gained;
      if (!rowsEqual(g[r], res.row)) moved = true;
    }
    for (var j = 0; j < dir; j++) ng = rotate(ng);
    if (!moved) return;
    grid = ng;
    score += gained;
    addRandomTile(grid, true);
    // win check
    if (!won) {
      outer: for (var wr = 0; wr < SIZE; wr++) for (var wc = 0; wc < SIZE; wc++)
        if (grid[wr][wc] && grid[wr][wc].v === 2048) { won = true; break outer; }
      if (won) { draw(); showMsg('你赢了！🎉'); return; }
    }
    draw();
    if (!canMove()) { over = true; showMsg('游戏结束'); }
  }

  function canMove() {
    if (emptyCells(grid).length) return true;
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      var v = grid[r][c].v;
      if (r + 1 < SIZE && grid[r+1][c].v === v) return true;
      if (c + 1 < SIZE && grid[r][c+1].v === v) return true;
    }
    return false;
  }

  function showMsg(t) { msgTitle.textContent = t; overlay.classList.add('show'); }

  document.getElementById('restart').onclick = newGame;
  document.getElementById('again').onclick = newGame;

  document.addEventListener('keydown', function(e) {
    var map = { ArrowLeft: 0, a: 0, A: 0, ArrowUp: 1, w: 1, W: 1, ArrowRight: 2, d: 2, D: 2, ArrowDown: 3, s: 3, S: 3 };
    if (e.key in map) { e.preventDefault(); move(map[e.key]); }
  });

  // D-pad buttons (reliable on mobile)
  var padBtns = document.querySelectorAll('.dpad button');
  for (var bi = 0; bi < padBtns.length; bi++) (function(btn){
    var d = parseInt(btn.getAttribute('data-d'), 10);
    function go(e){ if(e) e.preventDefault(); move(d); }
    btn.addEventListener('click', go);
    btn.addEventListener('touchend', function(e){ e.preventDefault(); e.stopPropagation(); move(d); }, {passive: false});
  })(padBtns[bi]);
  // touch swipe anywhere on the page
  var sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) { tracking = false; return; }
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
  }, {passive: true});
  document.addEventListener('touchmove', function(e){
    if (tracking) e.preventDefault();
  }, {passive: false});
  document.addEventListener('touchend', function(e){
    if (!tracking) return; tracking = false;
    // ignore swipes that started/ended on a button
    if (e.target.closest && e.target.closest('button')) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0);
    else move(dy > 0 ? 3 : 1);
  });

  window.addEventListener('resize', draw);
  newGame();
})();
</script>
</body>
</html>
