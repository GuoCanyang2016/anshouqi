<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#fbf5e3,#f3e7c6);color:#5a4632;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none}
#topbar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-size:15px}
#status{font-weight:bold;color:#c46a1b}
#controls{display:flex;gap:8px}
#controls button{background:#c46a1b;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
#controls button:active{background:#a05e12}
#board-wrap{position:relative;width:100%;max-width:480px;aspect-ratio:1/1;background:#e9d9ae;border-radius:12px;padding:11%;margin-bottom:12px}
#board{position:relative;width:100%;height:100%}
#grid-svg{position:absolute;inset:0;width:100%;height:100%}
.card{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s;z-index:2}
.card img{width:100%;height:100%;object-fit:contain;display:block;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.card.selected{transform:translate(-50%,-50%) scale(1.12);z-index:5}
.card.selected img{box-shadow:0 0 0 3px #e6a200,0 2px 8px rgba(0,0,0,.5)}
.card-back{background:linear-gradient(135deg,#2a4a7a,#1a2a4a);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#9db8dd;border:2px solid #3a5a8a}
.hint{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#1d9d55;z-index:3;pointer-events:none;box-shadow:0 0 8px #1d9d55;animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}}
.hint.cap{width:28px;height:28px;background:transparent;border:3px solid #e74c3c;box-shadow:0 0 10px #e74c3c;animation:hintPulse 1.2s ease-in-out infinite}
.lm{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none;border-radius:6px;aspect-ratio:2/3}
.lm.from{box-shadow:0 0 0 3px rgba(214,140,0,.95),0 0 16px rgba(214,140,0,.5)}
.lm.to{box-shadow:0 0 0 3px rgba(29,157,85,.95),0 0 16px rgba(29,157,85,.5)}
.move-ghost{position:absolute;transform:translate(-50%,-50%);z-index:60;pointer-events:none;transition:left .45s ease,top .45s ease}
.move-ghost img{width:100%;display:block;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.hole-label{position:absolute;transform:translate(-50%,-50%);color:#6b5636;font-size:13px;font-weight:bold;pointer-events:none;z-index:1}
.tree-badge{position:absolute;left:-8px;top:-12px;z-index:6;font-size:18px;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tree-known-tag{position:absolute;right:-4px;bottom:-8px;z-index:6;font-size:11px;font-weight:bold;color:#fff;background:#2b7a3d;border-radius:8px;padding:1px 6px;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tree-container{position:absolute;transform:translate(-50%,-50%);z-index:2;aspect-ratio:2/3}
.tree-bottom-inner{position:absolute;left:0;bottom:0;width:58%;aspect-ratio:2/3;background:linear-gradient(135deg,#2a4a7a,#1a2a4a);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#9db8dd;border:2px solid #3a5a8a;z-index:1}
.tree-bottom-inner.known-down{opacity:.45}
.tree-top-img{position:absolute;right:0;top:0;width:84%;z-index:2;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.4);display:block}
.tree-container.selected .tree-top-img{box-shadow:0 0 0 3px #e6a200,0 2px 8px rgba(0,0,0,.5)}
.known-card{opacity:.5;border:2px dashed #8a8a8a;border-radius:6px}
.known-card img{width:100%;height:100%;object-fit:contain;display:block;border-radius:4px}
.flip-tree-hint{position:absolute;transform:translate(-50%,-50%);z-index:7;pointer-events:auto;cursor:pointer;font-size:22px;background:rgba(255,255,255,.9);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#grid-svg line{stroke:#8a6f4d}
#share-hint{color:#8a7358!important}
#captured{width:100%;max-width:480px;display:flex;justify-content:space-between;padding:8px 4px;font-size:13px;margin-top:4px}
.cap-group{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.cap-group img{width:28px;height:40px;object-fit:contain;border-radius:3px}

#rules b{color:#c46a1b}
#toast{position:fixed;left:50%;bottom:25%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:100}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50}
#overlay.show{display:flex}
#ov-card{background:#f5ecd8;color:#5a4632;border-radius:14px;padding:32px 44px;text-align:center}
#ov-card h2{margin-bottom:12px}
#btn-again{background:#b73a2b;color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:16px;cursor:pointer;margin-top:8px}
#btn-agree{background:#2b8a3e;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:15px;cursor:pointer;margin:8px 0}
.thinking{color:#8a5a1b!important}
</style>

(function(){
  var colors=['red','blue'];
  for(var c=0;c<2;c++)for(var r=1;r<=8;r++){

<div id="topbar">
  <span id="status">点击翻牌开始</span>

</div>

  <div><div style="margin-bottom:4px" id="cap-title-human">你的缴获</div><div class="cap-group" id="cap-human"></div></div>
  <div><div style="margin-bottom:4px" id="cap-title-ai">小miu的缴获</div><div class="cap-group" id="cap-ai"></div></div>
</div>
<div id="rules">
  <b>玩法：</b>点牌翻面，首翻定颜色。轮流翻牌或走子。<br>
  吃子：象&gt;狮&gt;虎&gt;豹&gt;狼&gt;狗&gt;猫&gt;鼠；<b>同级相遇可点选同归于尽</b>（双方都移除，也可不走）；<b>鼠能吃象，象吃不了鼠</b>。<br>
  <b>鼠洞：</b>只有老鼠能进出中间的鼠洞（四个角），鼠洞里的老鼠吃不着。<br>
  <b>上树（村规）：</b>虎、豹、猫可以跳到相邻未翻开的牌上🌲，树上不能被吃；可下树到相邻空位，或跳杀相邻更小的敌子。点🌲或点选中后再点一次可翻树：翻出敌子比大小（大留小走，同级同归于尽）；翻出同阵营则换位。同一棵树最多翻两次。<br>
  吃光对方8张获胜。
</div>
<div id="toast"></div>
<div id="overlay"><div id="ov-card"><h2 id="ov-text"></h2>
<div id="ov-rematch" style="display:none;margin:6px 0">对方请求再来一局 <button id="btn-agree">同意</button></div>

<div id="share-hint" style="font-size:12px;color:#888;margin-top:10px">复制后发给小miu，它能帮你复盘</div></div></div>
<script>
/* ===== Game State ===== */
var COLS=4, ROWS=4;
// Hole corners: the 4 intersections around the center hole
var HOLE_CORNERS=[[1,1],[2,1],[1,2],[2,2]];
var HOLE_CX=1.5, HOLE_CY=1.5; // center of hole for rendering

var G; // game state
/* ============ 联机对战（P2P 开房间） ============ */
var NET={mode:'ai',role:'host',session:null};
function netActive(){return NET.mode==='net'&&NET.session&&NET.session.open;}
function myColor(){return G?(NET.role==='host'?G.human:G.ai):null;}
function isMyTurn(){return G?(G.turn==='human')===(NET.role==='host'):false;}
function oppName(){return netActive()?'对方':'小miu';}
function peerSlot(){return NET.role==='host'?'ai':'human';}
function snapG(){var st=cloneState(G);st.log=(G.log||[]).slice();return st;}
function loadSnap(st){
  G=st;if(!G.log)G.log=[];
  sel=null;hints=[];aiThinking=false;aiPrevMove=null;uiLastMove=null;uiAnimateMove=null;
  document.getElementById('overlay').classList.remove('show');
  var _rm=document.getElementById('ov-rematch');if(_rm)_rm.style.display='none';
  document.getElementById('ov-rematch').style.display='none';
  render();
}
function setStatusSafe(t){var el=document.getElementById('status');if(el)el.textContent=t;}
function netLobby(){
  if(typeof Netplay==='undefined'||typeof mqtt==='undefined'){
    toast('网络组件加载失败，已切回单机模式');NET.mode='ai';newGame();return;
  }
  Netplay.lobby('shouqi',{
    getSnapshot:snapG,
    onReady:function(sess,role,re){
      NET.mode='net';NET.role=role;NET.session=sess;
      if(!re){
        if(role==='host'){newGame();}
        else{setStatusSafe('已连接，等待房主发棋盘…');}
      }
      render();
    },
    onOp:onNetOp,
    onState:function(state){loadSnap(state);toast('已同步棋盘');},
    onClose:function(){
      if(NET.mode!=='net')return;
      Netplay.showDisconnect(
        function(){toast('正在重新连接…');NET.session.reconnect();},
        function(){NET.mode='ai';NET.session=null;newGame();});
    },
    onError:function(){},
    onRematch:onRematchRequest,
    onCancel:function(){NET.mode='ai';newGame();}
  });
}
function onNetOp(op){
  if(!netActive()||!G||G.over)return;
  realMove(G,op);
  aiPrevMove=op;
  var w=checkWin(G);
  if(w)endGame(w);
  render();
}
function doRematch(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('ov-rematch').style.display='none';
  if(netActive()){
    if(NET.role==='host'){newGame();NET.session.send({kind:'state',state:snapG(),rematch:true});}
    else{
      NET.session.send({kind:'rematch'});
      document.getElementById('ov-text').textContent='已请求再来一局，等待对方同意…';
      document.getElementById('overlay').classList.add('show');
    }
    return;
  }
  newGame();
}
function onRematchRequest(){
  if(!netActive())return;
  if(G&&G.over){
    document.getElementById('ov-rematch').style.display='block';
    document.getElementById('overlay').classList.add('show');
  }else toast('对方想再来一局，等这局结束');
}

function newState(){
  // Create 16 cards: 8 red, 8 blue, ranks 1-8
  var cards=[];
  for(var r=1;r<=8;r++){cards.push({c:'red',r:r,open:false});cards.push({c:'blue',r:r,open:false});}
  // Shuffle
  for(var i=cards.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=cards[i];cards[i]=cards[j];cards[j]=t;}
  // Place on 16 intersections (one card per intersection)
  var pts=[];
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)pts.push([x,y]);
  for(var i=pts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pts[i];pts[i]=pts[j];pts[j]=t;}
  
  var board=[];
  for(var y=0;y<ROWS;y++){board.push([]);for(var x=0;x<COLS;x++)board[y].push(null);}
  for(var i=0;i<16;i++){var p=pts[i];board[p[1]][p[0]]=cards[i];}
  
  return {
    board:board,
    hole:null, // card in hole, or null
    trees:{}, // "x,y" -> {top:{c,r}, flips:0, flipCamp:null}; bottom card stays in board[y][x] (face-down, known flag)
    turn:'human', // 'human' or 'ai'
    human:null, // 'red' or 'blue', set by first flip
    ai:null,
    over:false,
    winner:null,
    moveCount:0,
    lastFlip:0,
    capHuman:[], // pieces the human has captured (AI's lost pieces)
    capAI:[],    // pieces the AI has captured (human's lost pieces)
    log:[]       // real-game action log (for share); minimax clones don't use it
  };
}

function inBounds(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS;}
function isTree(st,x,y){return !!(st.trees&&(x+','+y) in st.trees);}
function treeKey(x,y){return x+','+y;}
function isHoleCorner(x,y){
  for(var i=0;i<HOLE_CORNERS.length;i++)if(HOLE_CORNERS[i][0]===x&&HOLE_CORNERS[i][1]===y)return true;
  return false;
}

/* ===== Capture Rules ===== */
function canCapture(att, def){
  // att, def are {r: rank}
  if(att.r===1&&def.r===8)return true;  // rat eats elephant
  if(att.r===8&&def.r===1)return false; // elephant cannot eat rat
  return att.r>=def.r;
}

/* ===== Move Generation ===== */
// Tree-climbing (村规): tiger(6)/leopard(5)/cat(2) can jump onto an adjacent
// face-down card ("tree"). While on a tree the piece cannot be captured
// (like the mouse in the hole), but the tree itself can be flipped.
var TREE_CLIMBERS={2:true,5:true,6:true};
function canFlipTree(st,x,y,side){
  var t=st.trees[treeKey(x,y)];
  if(!t)return false;
  if(t.flips>=2)return false;
  if(t.flipCamp&&st.human&&t.flipCamp!==side)return false;
  return true;
}
function getMoves(st, side){
  // side: 'red' or 'blue' (the color), returns list of moves
  // move: {type:'flip', x, y} | {type:'move', fx, fy, tx, ty} | {type:'enterHole', fx, fy} | {type:'exitHole', tx, ty}
  //       | {type:'climbTree', fx, fy, tx, ty} | {type:'climbDown', fx, fy, tx, ty, cap} | {type:'flipTree', x, y}
  var moves=[];
  var x,y;
  // Flips
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    var c=st.board[y][x];
    if(c&&!c.open&&!isTree(st,x,y))moves.push({type:'flip',x:x,y:y});
  }
  // Flip trees (either side may flip an unknown tree; after a same-camp reveal only that camp)
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(isTree(st,x,y)&&canFlipTree(st,x,y,side))moves.push({type:'flipTree',x:x,y:y});
  }
  // Piece moves
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    var c=st.board[y][x];
    if(!c||!c.open||c.c!==side)continue;
    var D=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=0;i<4;i++){
      var nx=x+D[i][0], ny=y+D[i][1];
      if(!inBounds(nx,ny))continue;
      if(isTree(st,nx,ny))continue; // trees are occupied; use climbTree/flipTree
      var t=st.board[ny][nx];
      if(!t){
        moves.push({type:'move',fx:x,fy:y,tx:nx,ty:ny,cap:null});
      }else if(t.open&&t.c!==side){
        if(c.r===t.r){
          // Equal ranks: optional mutual destruction (player chooses)
          moves.push({type:'sacrifice',fx:x,fy:y,tx:nx,ty:ny,foe:{r:t.r,c:t.c}});
        }else if(canCapture(c,t)){
          moves.push({type:'move',fx:x,fy:y,tx:nx,ty:ny,cap:{r:t.r,c:t.c}});
        }
      }else if(!t.open&&TREE_CLIMBERS[c.r]){
        // Climb onto adjacent face-down card
        moves.push({type:'climbTree',fx:x,fy:y,tx:nx,ty:ny});
      }
    }
    // Mouse can enter hole from corner
    if(c.r===1&&isHoleCorner(x,y)&&!st.hole){
      moves.push({type:'enterHole',fx:x,fy:y});
    }
  }
  // Tree tops: climb down to adjacent empty, or capture weaker adjacent enemy
  for(var tk in st.trees){
    var tr=st.trees[tk];
    if(tr.top.c!==side)continue;
    var txy=tk.split(','), tx0=+txy[0], ty0=+txy[1];
    var D2=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var j=0;j<4;j++){
      var dx=tx0+D2[j][0], dy=ty0+D2[j][1];
      if(!inBounds(dx,dy))continue;
      if(isTree(st,dx,dy))continue;
      var dt=st.board[dy][dx];
      if(!dt){
        moves.push({type:'climbDown',fx:tx0,fy:ty0,tx:dx,ty:dy,cap:null,pr:tr.top.r});
      }else if(dt.open&&dt.c!==side){
        if(canCapture(tr.top,dt)){
          moves.push({type:'climbDown',fx:tx0,fy:ty0,tx:dx,ty:dy,cap:{r:dt.r,c:dt.c},pr:tr.top.r});
        }else if(tr.top.r===dt.r){
          moves.push({type:'sacrifice',fromTree:true,fx:tx0,fy:ty0,tx:dx,ty:dy,foe:{r:dt.r,c:dt.c}});
        }
      }
      // face-down non-tree: cannot jump tree-to-tree (must climb down first)
    }
  }
  // Mouse in hole can exit to any corner
  if(st.hole&&st.hole.c===side){
    for(var i=0;i<HOLE_CORNERS.length;i++){
      var hx=HOLE_CORNERS[i][0], hy=HOLE_CORNERS[i][1];
      var t=st.board[hy][hx];
      if(!t){
        moves.push({type:'exitHole',tx:hx,ty:hy});
      }else if(t.open&&t.c!==side){
        if(st.hole.r===t.r){
          moves.push({type:'sacrifice',fromHole:true,tx:hx,ty:hy,foe:{r:t.r,c:t.c}});
        }else if(canCapture(st.hole,t)){
          moves.push({type:'exitHole',tx:hx,ty:hy,cap:{r:t.r,c:t.c}});
        }
      }
    }
  }
  return moves;
}

function doMove(st, m){
  // Apply move to state, return captured card or null
  var cap=null;
  if(m.type==='flip'){
    var c=st.board[m.y][m.x];
    c.open=true;
    // First flip determines colors
    if(!st.human){
      // The flipper gets the flipped color
      // turn is 'human' or 'ai', so:
      if(st.turn==='human'){st.human=c.c;st.ai=(c.c==='red'?'blue':'red');}
      else{st.ai=c.c;st.human=(c.c==='red'?'blue':'red');}
    }
    st.lastFlip=st.moveCount;
  }else if(m.type==='climbTree'){
    // Open tiger/leopard/cat jumps onto adjacent face-down card
    var pcl=st.board[m.fy][m.fx];
    var bot=st.board[m.ty][m.tx];
    if(bot)bot.known=false;
    st.trees[treeKey(m.tx,m.ty)]={top:{c:pcl.c,r:pcl.r},flips:0,flipCamp:null};
    st.board[m.fy][m.fx]=null;
  }else if(m.type==='climbDown'){
    // Tree top moves to adjacent empty or captures weaker enemy
    var tk=treeKey(m.fx,m.fy), tr=st.trees[tk];
    var tc=st.board[m.ty][m.tx];
    if(tc){cap=tc;recordCapture(st,tc.c,tc.r);}
    st.board[m.ty][m.tx]={c:tr.top.c,r:tr.top.r,open:true};
    delete st.trees[tk];
    // bottom card stays face-down at (fx,fy), keeps its known flag
  }else if(m.type==='flipTree'){
    // Flip the tree card underneath the climber
    var fk=treeKey(m.x,m.y), ft=st.trees[fk];
    var fb=st.board[m.y][m.x];
    ft.flips++;
    fb.known=true;
    if(fb.c!==ft.top.c){
      // Enemy: compare sizes, bigger stays face-up, tree gone
      if(ft.top.r>fb.r){
        recordCapture(st,fb.c,fb.r);
        cap={r:fb.r,c:fb.c};
        st.board[m.y][m.x]={c:ft.top.c,r:ft.top.r,open:true};
      }else if(ft.top.r<fb.r){
        recordCapture(st,ft.top.c,ft.top.r);
        cap={r:ft.top.r,c:ft.top.c};
        st.board[m.y][m.x]={c:fb.c,r:fb.r,open:true};
      }else{
        // Equal: mutual destruction
        recordCapture(st,ft.top.c,ft.top.r);
        recordCapture(st,fb.c,fb.r);
        cap={r:fb.r,c:fb.c,sacrifice:true,own:{r:ft.top.r,c:ft.top.c}};
        st.board[m.y][m.x]=null;
      }
      delete st.trees[fk];
    }else{
      // Same camp: swap — bottom comes up open, top goes down face-down (known)
      var oldTop=ft.top;
      st.board[m.y][m.x]={c:oldTop.c,r:oldTop.r,open:false,known:true};
      ft.top={c:fb.c,r:fb.r};
      ft.flipCamp=fb.c; // only this camp may flip this tree afterwards
    }
    st.lastFlip=st.moveCount;
  }else if(m.type==='move'){
    var pc=st.board[m.fy][m.fx];
    var tc=st.board[m.ty][m.tx];
    if(tc){cap=tc;recordCapture(st,tc.c,tc.r);}
    st.board[m.ty][m.tx]=pc;
    st.board[m.fy][m.fx]=null;
  }else if(m.type==='sacrifice'){
    // Mutual destruction: both pieces removed from board
    var att;
    if(m.fromHole){att=st.hole;}
    else if(m.fromTree){att=st.trees[treeKey(m.fx,m.fy)].top;}
    else{att=st.board[m.fy][m.fx];}
    var tc2=st.board[m.ty][m.tx];
    if(m.fromHole)st.hole=null;
    else if(m.fromTree)delete st.trees[treeKey(m.fx,m.fy)];
    else st.board[m.fy][m.fx]=null;
    st.board[m.ty][m.tx]=null;
    recordCapture(st,att.c,att.r); // human's lost piece -> capAI
    recordCapture(st,tc2.c,tc2.r); // AI's lost piece -> capHuman
    cap={r:tc2.r,c:tc2.c,sacrifice:true,own:{r:att.r,c:att.c}};
  }else if(m.type==='enterHole'){
    st.hole=st.board[m.fy][m.fx];
    st.board[m.fy][m.fx]=null;
  }else if(m.type==='exitHole'){
    var tc=st.board[m.ty][m.tx];
    if(tc){cap=tc;recordCapture(st,tc.c,tc.r);}
    st.board[m.ty][m.tx]=st.hole;
    st.hole=null;
  }
  st.moveCount++;
  // Switch turn
  st.turn=(st.turn==='human'?'ai':'human');
  return cap;
}

// Track a captured piece explicitly: the loser (color loserC, rank loserR)
// is added to the winner's capture list.
function recordCapture(st, loserC, loserR){
  if(!st.human)return; // colors not determined yet; captures can't happen anyway
  var list=(loserC===st.human)?st.capAI:st.capHuman;
  list.push({c:loserC,r:loserR});
}

function countCards(st, color){
  var n=0;
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var c=st.board[y][x];
    if(c&&c.c===color)n++;
  }
  if(st.hole&&st.hole.c===color)n++;
  for(var k in st.trees){
    if(st.trees[k].top.c===color)n++;
  }
  return n;
}

function checkWin(st){
  var hr=countCards(st,'red'), hb=countCards(st,'blue');
  if(hr===0&&hb===0)return 'draw';
  if(hr===0)return 'blue';
  if(hb===0)return 'red';
  // 80 moves without capture = draw (prevent infinite)
  if(st.moveCount-st.lastFlip>160)return 'draw';
  return null;
}

/* ===== 战绩分享：对局记录与摘要（只走真实对局；AI 推演的克隆不走这里） ===== */

// 真实走子统一入口：先记录动作，再调核心 doMove。minimax 内部仍用 _doMove 直调克隆。
function realMove(st,m){
  var actor=st.turn; // 'human' | 'ai'
  var e=null,cap=null;
  if(m.type==='flip'){
    cap=doMoveCore(st,m);

    e={by:actor,type:'flip',n:st.moveCount,x:m.x,y:m.y,cc:c.c,cr:c.r};
  }else{
    if(m.type==='move'){
      var pc=st.board[m.fy][m.fx];

    }else if(m.type==='climbTree'){
      var pct=st.board[m.fy][m.fx];

      var pft=st.trees[treeKey(m.x,m.y)].top;

         topC:pft.c,topR:pft.r,botC:pfb.c,botR:pfb.r,botKnown:!!pfb.known};
    }else if(m.type==='sacrifice'){
      var att=m.fromHole?st.hole:st.board[m.fy][m.fx];
      e={by:actor,type:'sacrifice',n:st.moveCount+1,ownR:att.r,foeR:(m.foe?m.foe.r:null),fromHole:!!m.fromHole,fx:m.fx,fy:m.fy,tx:m.tx,ty:m.ty};
    }else if(m.type==='enterHole'){
      var pc2=st.board[m.fy][m.fx];
      e={by:actor,type:'enterHole',n:st.moveCount+1,pr:pc2.r,fx:m.fx,fy:m.fy};
    }else if(m.type==='exitHole'){
      var pc3=st.hole;
      e={by:actor,type:'exitHole',n:st.moveCount+1,pr:pc3.r,tx:m.tx,ty:m.ty};
    }
    // Last-move highlight for the real game (minimax uses _doMove on clones, never here)

    // Toast text hints for flips and captures (like daoshaji)
    if(st===G&&e&&typeof toast==='function'){

      s2+=colN(cc)+RANK_NAME[L.pr]+pos(L.fx,L.fy)+'→上树'+pos(L.tx,L.ty)+'🌲';

      var dc=L.by==='human'?hC:aC, dc2=dc==='red'?'blue':'red';

      if(L.capR)s2+=' 吃'+colN(dc2)+RANK_NAME[L.capR];
    }else if(L.type==='move'){
      var mc=L.by==='human'?hC:aC, oc=mc==='red'?'blue':'red';
      s2+=colN(mc)+RANK_NAME[L.pr]+pos(L.fx,L.fy)+'→'+pos(L.tx,L.ty);

/* ===== AI (2-ply minimax with alpha-beta) ===== */
var RANK_VAL={1:100,2:30,3:40,4:60,5:90,6:140,7:180,8:250};

function evaluate(st, aiColor){
  // Positive = good for aiColor
  var score=0;
  var oppColor=(aiColor==='red'?'blue':'red');
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var c=st.board[y][x];
    if(!c||!c.open)continue;
    var v=RANK_VAL[c.r];
    // Center control bonus
    var cx=Math.abs(x-1.5), cy=Math.abs(y-1.5);
    v+= (4-cx-cy)*2;
    if(c.c===aiColor)score+=v; else score-=v;
  }
  // Hole mouse bonus (safe)
  if(st.hole){
    var hv=RANK_VAL[st.hole.r]+50; // safe bonus
    if(st.hole.c===aiColor)score+=hv; else score-=hv;
  }
  // Tree tops are safe (cannot be captured while on tree)
  for(var tk2 in st.trees){
    var tr2=st.trees[tk2];
    var tv=RANK_VAL[tr2.top.r]+40; // safe bonus
    if(tr2.top.c===aiColor)score+=tv; else score-=tv;
  }
  // Unflipped cards: expected value (unknown, slight bonus for having more)
  var aiUn=0, oppUn=0;
  // (we don't know colors of unflipped, so skip detailed)

  // Tip: elephant safety — enemy mouse near my elephant is dangerous
  var aiEle=null, oppMouse=null, aiMouse=null, oppEle=null, revCount=0;
  for(var ey=0;ey<ROWS;ey++)for(var ex=0;ex<COLS;ex++){
    var ec=st.board[ey][ex];
    if(!ec||!ec.open)continue;
    revCount++;
    if(ec.c===aiColor){
      if(ec.r===8)aiEle={x:ex,y:ey};
      if(ec.r===1)aiMouse={x:ex,y:ey};
    }else{
      if(ec.r===1)oppMouse={x:ex,y:ey};
      if(ec.r===8)oppEle={x:ex,y:ey};
    }
  }
  if(aiEle&&oppMouse){
    var d=Math.abs(aiEle.x-oppMouse.x)+Math.abs(aiEle.y-oppMouse.y);
    if(d===1)score-=120;      // mouse adjacent to elephant: very dangerous
    else if(d===2)score-=50;  // mouse close to elephant
  }
  if(aiMouse&&oppEle){
    var d2=Math.abs(aiMouse.x-oppEle.x)+Math.abs(aiMouse.y-oppEle.y);
    if(d2===1)score+=40;      // my mouse can eat their elephant next
  }
  // Tip 4 (endgame): hole mouse threatens enemy elephant late
  if(st.hole&&st.hole.c===aiColor&&st.hole.r===1&&oppEle&&revCount<=10){
    score+=60;
  }
  return score;
}

function cloneState(st){
  var nb=[];
  for(var y=0;y<ROWS;y++){nb.push([]);for(var x=0;x<COLS;x++){
    var c=st.board[y][x];
    nb[y].push(c?{c:c.c,r:c.r,open:c.open,known:!!c.known}:null);
  }}
  var nt={};
  for(var k in st.trees){
    var t=st.trees[k];
    nt[k]={top:{c:t.top.c,r:t.top.r},flips:t.flips,flipCamp:t.flipCamp};
  }
  return {
    board:nb,
    hole:st.hole?{c:st.hole.c,r:st.hole.r,open:true}:null,
    trees:nt,
    turn:st.turn, human:st.human, ai:st.ai,
    over:st.over, winner:st.winner,
    moveCount:st.moveCount, lastFlip:st.lastFlip,
    capHuman:(st.capHuman||[]).map(function(e){return {c:e.c,r:e.r};}),
    capAI:(st.capAI||[]).map(function(e){return {c:e.c,r:e.r};})
  };
}

function minimax(st, depth, alpha, beta, maximizing, aiColor){
  var win=checkWin(st);
  if(win){
    if(win==='draw')return 0;
    return (win===aiColor?10000:-10000);
  }
  if(depth===0)return evaluate(st, aiColor);
  
  var side = maximizing ? aiColor : (aiColor==='red'?'blue':'red');
  // If colors not determined yet, use turn-based
  if(!st.human){
    // Before first flip, just use heuristic
    return evaluate(st, aiColor);
  }
  
  var moves=getMoves(st, side);
  if(!moves.length)return evaluate(st, aiColor);
  
  // Order moves: captures first
  moves.sort(function(a,b){
    var va=a.cap?RANK_VAL[a.cap.r]:(a.foe?RANK_VAL[a.foe.r]:0), vb=b.cap?RANK_VAL[b.cap.r]:(b.foe?RANK_VAL[b.foe.r]:0);
    return vb-va;
  });
  // Limit branching for speed
  if(moves.length>12)moves=moves.slice(0,12);
  
  if(maximizing){
    var best=-Infinity;
    for(var i=0;i<moves.length;i++){
      var ns=cloneState(st);
      _doMove(ns, moves[i]);
      var v=minimax(ns, depth-1, alpha, beta, false, aiColor);
      best=Math.max(best, v);
      alpha=Math.max(alpha, best);
      if(beta<=alpha)break;
    }
    return best;
  }else{
    var best=Infinity;
    for(var i=0;i<moves.length;i++){
      var ns=cloneState(st);
      _doMove(ns, moves[i]);
      var v=minimax(ns, depth-1, alpha, beta, true, aiColor);
      best=Math.min(best, v);
      beta=Math.min(beta, best);
      if(beta<=alpha)break;
    }
    return best;
  }
}


/* ===== AI strategy heuristics (user's tips) ===== */
var aiPrevMove=null; // AI's last move, for anti-oscillation
var uiLastMove=null;   // last move highlight {fx,fy,tx,ty} (persists until next move)
var uiAnimateMove=null; // one-shot slide animation {fx,fy,tx,ty,img}

function isReverseMove(m, prev){
  if(!prev||!m)return false;
  if(m.type==='move'&&prev.type==='move'){
    return m.fx===prev.tx&&m.fy===prev.ty&&m.tx===prev.fx&&m.ty===prev.fy;
  }
  if(m.type==='exitHole'&&prev.type==='enterHole'){
    return m.tx===prev.fx&&m.ty===prev.fy;
  }
  if(m.type==='enterHole'&&prev.type==='exitHole'){
    return m.fx===prev.tx&&m.fy===prev.ty;
  }
  // Climbing up then immediately down (or down then up) is oscillation
  if(m.type==='climbDown'&&prev.type==='climbTree'){
    return m.fx===prev.tx&&m.fy===prev.ty;
  }
  if(m.type==='climbTree'&&prev.type==='climbDown'){
    return m.tx===prev.fx&&m.ty===prev.fy;
  }
  return false;
}

// Score a face-down flip candidate using positional heuristics.
// Tip 1: flip adjacent to own STRONG pieces (elephant etc.) = safe.
// Tip 2: avoid flipping adjacent to own MOUSE (risky).
function flipScore(st, x, y, aiColor){
  var s=0;
  var D=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<4;i++){
    var nx=x+D[i][0], ny=y+D[i][1];
    if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;
    var nc=st.board[ny][nx];
    if(!nc||!nc.open)continue;
    if(nc.c===aiColor){
      if(nc.r===8)s+=60;       // own elephant nearby: safest
      else if(nc.r>=6)s+=40;   // own lion/tiger nearby
      else if(nc.r===1)s-=50;  // own mouse nearby: do NOT flip here
      else if(nc.r<=3)s-=20;   // own weak piece nearby
      else s+=10;
    }else{
      s+=10;                   // enemy nearby: information value
      if(nc.r>=7)s-=10;        // ...but strong enemy nearby is risky
    }
  }
  // Slight center preference
  s+=(3-(Math.abs(x-1.5)+Math.abs(y-1.5)))*3;
  return s;
}

// Manhattan distance from (x,y) to nearest hole corner
function distToHole(x,y){
  var d=99;
  for(var i=0;i<HOLE_CORNERS.length;i++){
    var dd=Math.abs(x-HOLE_CORNERS[i][0])+Math.abs(y-HOLE_CORNERS[i][1]);
    if(dd<d)d=dd;
  }
  return d;
}

function aiChoose(st){
  var aiColor=st.ai;
  if(!aiColor){
    // Before color determined, flip a random card (prefer center)
    var moves=getMoves(st, 'red'); // flips available to anyone
    var flips=moves.filter(function(m){return m.type==='flip';});
    if(!flips.length)return null;
    // Prefer center flips
    flips.sort(function(a,b){
      var da=Math.abs(a.x-1.5)+Math.abs(a.y-1.5);
      var db=Math.abs(b.x-1.5)+Math.abs(b.y-1.5);
      return da-db;
    });
    return flips[0];
  }
  
  var moves=getMoves(st, aiColor);
  if(!moves.length)return null;
  
  // Separate flips and moves
  var flips=moves.filter(function(m){return m.type==='flip';});
  var actions=moves.filter(function(m){return m.type!=='flip';});
  
  // Decide: flip or move?
  // Heuristic: if behind in material or few pieces, prefer flip
  var myCount=countCards(st, aiColor);
  var oppColor=(aiColor==='red'?'blue':'red');
  var oppCount=countCards(st, oppColor);
  
  var bestMove=null, bestVal=-Infinity;
  
  // Evaluate actions with 2-ply + strategy heuristics
  for(var i=0;i<actions.length;i++){
    var a=actions[i];
    var ns=cloneState(st);
    _doMove(ns, a);
    var v=minimax(ns, 1, -Infinity, Infinity, false, aiColor);
    // Tip 3: mouse to hole ASAP — highest priority
    if(a.type==='enterHole')v+=120;
    // Tip 3b: move mouse TOWARD hole corners
    if(a.type==='move'){
      var pc=st.board[a.fy][a.fx];
      if(pc&&pc.r===1){
        var d0=distToHole(a.fx,a.fy), d1=distToHole(a.tx,a.ty);
        v+=(d0-d1)*25; // reward getting closer to hole
      }
    }
    // Tip: exit hole to capture is valuable
    if(a.type==='exitHole'&&a.cap)v+=RANK_VAL[a.cap.r]*0.8;
    // Tip 5: NEVER oscillate — heavily penalize immediate reversal
    if(isReverseMove(a, aiPrevMove))v-=200;
    // Small random tiebreak
    v+=Math.random()*5;
    if(v>bestVal){bestVal=v;bestMove=a;}
  }
  
  // Evaluate best flip (1-ply + heuristic)
  var bestFlip=null, flipVal=-Infinity;
  if(flips.length){
    // Limit flip candidates for speed
    var fc=flips.slice(0,8);
    for(var i=0;i<fc.length;i++){
      var ns=cloneState(st);
      // _doMove determinizes the flip (swaps with a random face-down card),
      // so the sim cannot peek at the true card underneath.
      _doMove(ns, fc[i]);
      // After flip, the flipped card is now known in ns
      var v=minimax(ns, 1, -Infinity, Infinity, false, aiColor);
      // Bonus for flipping when behind
      if(myCount<oppCount)v+=30;
      // Tips 1&2: positional flip heuristics (near strong own pieces +, near own mouse -)
      v+=flipScore(st, fc[i].x, fc[i].y, aiColor);
      v+=Math.random()*5;
      if(v>flipVal){flipVal=v;bestFlip=fc[i];}
    }
  }
  
  // Choose between best move and best flip
  if(bestFlip&&(!bestMove||flipVal>bestVal+10)){
    return bestFlip;
  }
  return bestMove||bestFlip;
}

/* ===== UI Rendering ===== */
var sel=null; // {x,y} selected, or 'hole'
var hints=[];
var aiThinking=false;

function px(x){return (x/(COLS-1)*100);}
function py(y){return (y/(ROWS-1)*100);}

// Slide a ghost of the moved piece from origin to destination over the fresh board
function animateGhost(boardEl,am,cardW){
  try{
    var g=document.createElement('div');
    g.className='move-ghost';
    var img=document.createElement('img');
    img.src=am.img;img.draggable=false;img.alt='';
    g.appendChild(img);
    g.style.width=cardW+'%';
    g.style.left=px(am.fx)+'%';g.style.top=py(am.fy)+'%';
    boardEl.appendChild(g);
    var raf=(typeof requestAnimationFrame!=='undefined')?requestAnimationFrame:function(f){f();};
    raf(function(){raf(function(){
      g.style.left=px(am.tx)+'%';g.style.top=py(am.ty)+'%';
    });});
    setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g);},600);
  }catch(e){}
}
function render(){
  if(!G)return;
  var boardEl=document.getElementById('board');
  boardEl.innerHTML='';
  
  // SVG grid lines
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('id','grid-svg');
  svg.setAttribute('viewBox','0 0 100 100');
  svg.setAttribute('preserveAspectRatio','none');
  
  // Vertical lines
  for(var x=0;x<COLS;x++){
    var l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',px(x));l.setAttribute('y1',py(0));
    l.setAttribute('x2',px(x));l.setAttribute('y2',py(ROWS-1));
    l.setAttribute('stroke','#5a6a8a');l.setAttribute('stroke-width','0.8');
    svg.appendChild(l);
  }
  // Horizontal lines
  for(var y=0;y<ROWS;y++){
    var l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',px(0));l.setAttribute('y1',py(y));
    l.setAttribute('x2',px(COLS-1));l.setAttribute('y2',py(y));
    l.setAttribute('stroke','#5a6a8a');l.setAttribute('stroke-width','0.8');
    svg.appendChild(l);
  }
  // Hole: dashed rectangle around the 4 corners
  var hx1=px(1), hy1=py(1), hx2=px(2), hy2=py(2);
  var rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',hx1);rect.setAttribute('y',hy1);
  rect.setAttribute('width',hx2-hx1);rect.setAttribute('height',hy2-hy1);
  rect.setAttribute('fill','rgba(120,90,40,0.15)');
  rect.setAttribute('stroke','#a08040');rect.setAttribute('stroke-width','0.8');
  rect.setAttribute('stroke-dasharray','2,1.5');
  rect.setAttribute('rx','2');
  svg.appendChild(rect);
  boardEl.appendChild(svg);
  
  // Hole label
  var hl=document.createElement('div');
  hl.className='hole-label';hl.textContent='鼠洞';
  hl.style.left=px(HOLE_CX)+'%';hl.style.top=py(HOLE_CY)+'%';
  boardEl.appendChild(hl);
  
  // Clickable hole area for mouse entry
  var hz=document.createElement('div');
  hz.style.position='absolute';
  hz.style.left=px(1)+'%';hz.style.top=py(1)+'%';
  hz.style.width=(px(2)-px(1))+'%';hz.style.height=(py(2)-py(1))+'%';
  hz.className='hole-zone';
  hz.style.transform='translate(0,0)';hz.style.zIndex='1';hz.style.cursor='pointer';
  hz.addEventListener('click',function(){onTapHoleArea();});
  boardEl.appendChild(hz);
  
  // Hole mouse (if any)
  if(G.hole){
    var hd=document.createElement('div');
    hd.className='card'+(sel==='hole'?' selected':'');
    hd.style.left=px(HOLE_CX)+'%';hd.style.top=py(HOLE_CY)+'%';
    hd.style.width='20%';
    var img=document.createElement('img');
    img.src='img/'+G.hole.c+'_'+G.hole.r+'.png';
    img.alt='';
    hd.appendChild(img);
    hd.addEventListener('click',function(){onTapHole();});
    boardEl.appendChild(hd);
  }
  
  // Cards on intersections
  var cardW=20; // % width
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    (function(x,y){
      var c=G.board[y][x];
      if(!c)return;
      var tk=treeKey(x,y), tree=G.trees[tk];
      if(tree){
        // Tree: container with bottom card (small, bottom-left) + top piece (main, top-right) + badges
        var known=!!c.known;
        var dc=document.createElement('div');
        dc.className='card tree-container'+(sel&&sel.tree&&sel.x===x&&sel.y===y?' selected':'');
        dc.style.left=px(x)+'%';dc.style.top=py(y)+'%';
        dc.style.width=cardW+'%';
        // bottom (the tree itself, partially visible)
        var db=document.createElement('div');
        db.className='tree-bottom-inner'+(known?' known-down':'');
        db.innerHTML='<span>兽</span>';
        dc.appendChild(db);
        // top piece
        var img=document.createElement('img');
        img.className='tree-top-img';
        img.src='img/'+tree.top.c+'_'+tree.top.r+'.png';
        img.alt='';
        dc.appendChild(img);
        // tree badge (tap to flip tree)
        var badge=document.createElement('span');
        badge.className='tree-badge';
        badge.textContent='🌲';
        badge.title='翻树';
        badge.addEventListener('click',function(ev){ev.stopPropagation();onTapTreeBadge(x,y);});
        dc.appendChild(badge);
        // known-bottom tag: e.g. "猫树"
        if(known){
          var tag=document.createElement('span');
          tag.className='tree-known-tag';
          tag.textContent=RANK_NAME[c.r]+'树';
          dc.appendChild(tag);
        }
        dc.addEventListener('click',function(){onTap(x,y);});
        boardEl.appendChild(dc);
        return;
      }
      var d=document.createElement('div');
      d.className='card';
      if(sel&&sel.x===x&&sel.y===y&&!sel.tree)d.classList.add('selected');
      d.style.left=px(x)+'%';d.style.top=py(y)+'%';
      d.style.width=cardW+'%';
      if(c.open){
        var img=document.createElement('img');
        img.src='img/'+c.c+'_'+c.r+'.png';
        img.alt='';
        // Highlight hole corners
        if(isHoleCorner(x,y)){
          img.style.boxShadow='0 0 0 2px #a08040,'+img.style.boxShadow;
        }
        d.appendChild(img);
      }else if(c.known){
        // Known but face-down: show what it is at reduced opacity + dashed border
        d.classList.add('known-card');
        var kimg=document.createElement('img');
        kimg.src='img/'+c.c+'_'+c.r+'.png';
        kimg.alt='';
        d.appendChild(kimg);
        d.style.aspectRatio='2/3';
      }else{
        d.classList.add('card-back');
        d.innerHTML='<span>兽</span>';
        d.style.aspectRatio='2/3';
      }
      d.addEventListener('click',function(){onTap(x,y);});
      boardEl.appendChild(d);
    })(x,y);
  }
  
  // Hints
  for(var i=0;i<hints.length;i++){
    var h=hints[i];
    var hd=document.createElement('div');
    hd.className='hint'+((h.cap||h.type==='sacrifice')?' cap':'');
    if(h.type==='enterHole'){
      hd.style.left=px(HOLE_CX)+'%';hd.style.top=py(HOLE_CY)+'%';
    }else{
      hd.style.left=px(h.tx)+'%';hd.style.top=py(h.ty)+'%';
    }
    boardEl.appendChild(hd);
  }
  
  // Status
  var st=document.getElementById('status');
  if(G.over){
    var _foe=netActive()?'对方':'小miu';
    st.textContent=G.winner==='draw'?'和棋！':(G.winner===myColor()?'你赢了！':_foe+'赢了！');
  }else if(aiThinking){
    st.textContent='小miu 思考中...';st.classList.add('thinking');
  }else if(netActive()&&!isMyTurn()){
    st.classList.remove('thinking');
    st.textContent='对方思考中...';
  }else{
    st.classList.remove('thinking');
    var _mc=myColor();
    var colName=_mc?(_mc==='red'?'红方':'蓝方'):'';
    st.textContent='轮到你走棋'+(colName?'（你是'+colName+'）':(NET.role==='host'?'（先翻牌）':'（等待对方翻牌）'));
  }
  
  // Last-move highlight: amber ring = origin, green ring = destination
  if(uiLastMove){
    var _lm=uiLastMove;
    var _mf=document.createElement('div');
    _mf.className='lm from';
    _mf.style.left=px(_lm.fx)+'%';_mf.style.top=py(_lm.fy)+'%';_mf.style.width='20%';
    boardEl.appendChild(_mf);
    var _mt=document.createElement('div');
    _mt.className='lm to';
    _mt.style.left=px(_lm.tx)+'%';_mt.style.top=py(_lm.ty)+'%';_mt.style.width='20%';
    boardEl.appendChild(_mt);
  }
  // One-shot slide animation for the just-played move
  if(uiAnimateMove){
    var _am=uiAnimateMove;uiAnimateMove=null;
    animateGhost(boardEl,_am,20);
  }

  // Captured
  renderCaptured();
}

function renderCaptured(){
  // Captures are tracked explicitly in G.capHuman / G.capAI (no board inference)
  var hc=document.getElementById('cap-human');
  var ac=document.getElementById('cap-ai');
  hc.innerHTML='';ac.innerHTML='';
  var _myArr=(NET.role==='host')?G.capHuman:G.capAI;
  var _peerArr=(NET.role==='host')?G.capAI:G.capHuman;
  document.getElementById('cap-title-ai').textContent=netActive()?'对方的缴获':'小miu的缴获';
  var lists=[[hc,_myArr],[ac,_peerArr]];
  for(var i=0;i<lists.length;i++){
    var el=lists[i][0], arr=lists[i][1]||[];
    for(var j=0;j<arr.length;j++){
      var img=document.createElement('img');
      img.src='img/'+arr[j].c+'_'+arr[j].r+'.png';
      img.alt='';
      el.appendChild(img);
    }
  }
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(function(){t.style.display='none';},1500);
}

function getMovesForTree(st,x,y,color){
  var all=getMoves(st,color);
  return all.filter(function(m){
    return (m.fx===x&&m.fy===y&&(m.type==='climbDown'||(m.type==='sacrifice'&&m.fromTree)));
  });
}
function onTapTreeBadge(x,y){
  if(!G||G.over||aiThinking)return;
  if(!isMyTurn())return;
  if(!canFlipTree(G,x,y,myColor())){toast('这棵树不能再翻了');return;}
  var fm={type:'flipTree',x:x,y:y};
  realMove(G,fm);
  sel=null;hints=[];
  afterHumanMove(fm);
}
/* ===== Interaction ===== */
function onTap(x,y){
  if(!G||G.over||aiThinking)return;
  if(!isMyTurn())return;
  var c=G.board[y][x];
  var tk=treeKey(x,y), tree=G.trees[tk];
  
  // If something is selected, try to match a hint first (covers climbTree to face-down, climbDown)
  if(sel){
    for(var i=0;i<hints.length;i++){
      var h=hints[i];
      if(h.tx===x&&h.ty===y){
        realMove(G,h);
        sel=null;hints=[];
        afterHumanMove(h);
        return;
      }
    }
  }
  // Tree position
  if(tree){
    // Tapping the already-selected tree again flips it
    if(sel&&sel.tree&&sel.x===x&&sel.y===y){
      if(!canFlipTree(G,x,y,myColor())){toast('这棵树不能再翻了');sel=null;hints=[];render();return;}
      var fm={type:'flipTree',x:x,y:y};
      realMove(G,fm);
      sel=null;hints=[];
      afterHumanMove(fm);
      return;
    }
    if(tree.top.c===myColor()){
      sel={x:x,y:y,tree:true};
      hints=getMovesForTree(G,x,y,myColor());
      render();
      if(!hints.length)toast('树上这张没有可下的位置（再点一次可翻树）');
      else toast('已选中树上棋子，再点一次翻树');
      return;
    }else{
      // Opponent's tree: flip it
      if(!canFlipTree(G,x,y,myColor())){toast('这棵树不能再翻了');return;}
      var fm2={type:'flipTree',x:x,y:y};
      realMove(G,fm2);
      sel=null;hints=[];
      afterHumanMove(fm2);
      return;
    }
  }
  
  // Flip face-down card
  if(c&&!c.open){
    var fm3={type:'flip',x:x,y:y};
    realMove(G,fm3);
    afterHumanMove(fm3);
    return;
  }
  // Deselect
  if(sel&&sel.x===x&&sel.y===y&&!sel.tree){sel=null;hints=[];render();return;}
  // Select own piece
  if(c&&c.open&&G.human&&c.c===myColor()){
    sel={x:x,y:y};
    hints=getMovesFor(G,x,y,myColor());
    render();
    if(!hints.length)toast('这张牌没有可走的位置');
    return;
  }
  // No hint matched and nothing selected: clear
  sel=null;hints=[];render();
}

function onTapHoleArea(){
  if(G.over||aiThinking)return;
  if(!isMyTurn())return;
  // If a mouse is selected at a hole corner, enter the hole
  if(sel&&sel.x!==undefined){
    var c=G.board[sel.y][sel.x];
    if(c&&c.open&&c.c===myColor()&&c.r===1&&isHoleCorner(sel.x,sel.y)&&!G.hole){
      var em={type:'enterHole',fx:sel.x,fy:sel.y};
      realMove(G,em);
      sel=null;hints=[];
      afterHumanMove(em);
      return;
    }
  }
  // If mouse is in hole, select it
  if(G.hole&&G.hole.c===myColor()){
    onTapHole();
  }
}
function onTapHole(){
  if(G.over||aiThinking)return;
  if(!isMyTurn())return;
  // Select mouse in hole
  if(G.hole&&G.hole.c===myColor()){
    sel='hole';
    hints=getMovesForHole(G,myColor());
    render();
  }
}

function getMovesFor(st,x,y,color){
  var all=getMoves(st,color);
  return all.filter(function(m){
    return (m.fx===x&&m.fy===y);
  });
}
function getMovesForHole(st,color){
  var all=getMoves(st,color);
  return all.filter(function(m){return m.type==='exitHole'||(m.type==='sacrifice'&&m.fromHole);});
}

// Wrapper for doMove to match UI call signature.
// _doMove is search-only (the real game goes through realMove), and the search
// must not peek under face-down cards: flips use determinized sampling, i.e.
// the flip target is swapped with a random other face-down card before the
// simulated reveal, so the search sees a random world consistent with public
// info instead of the true hidden layout.
var _doMove=(function(orig){
  return function(st,m){
    if(m&&(m.type==='flip'||m.type==='flipTree')){
      var tx=m.x, ty=m.y;
      var target=st.board[ty][tx];
      // Only sample when the target identity is truly unknown.
      if(target&&!target.known){
        var hx=[],hy=[],_sx,_sy;
        for(_sy=0;_sy<ROWS;_sy++)for(_sx=0;_sx<COLS;_sx++){
          var _q=st.board[_sy][_sx];
          // Only swap with truly unknown cards: face-down, not a tree bottom,
          // and not the tree being flipped.
          if(_q&&!_q.open&&!_q.known&&!isTree(st,_sx,_sy)&&!(_sx===tx&&_sy===ty)){hx.push(_sx);hy.push(_sy);}
        }
        if(hx.length){
          var _ri=(Math.random()*hx.length)|0;
          var _tmp=st.board[ty][tx];
          st.board[ty][tx]=st.board[hy[_ri]][hx[_ri]];
          st.board[hy[_ri]][hx[_ri]]=_tmp;
        }
      }
    }
    return orig(st,m);
  };
})(doMove);
doMove=function(st,type,fx,fy,tx,ty){
  if(type==='flip'){
    return realMove(st,{type:'flip',x:fx,y:fy});
  }else if(type==='move'){
    // Find the move object
    var moves=getMoves(st, st.human);
    for(var i=0;i<moves.length;i++){
      var m=moves[i];
      if(m.type==='move'&&m.fx===fx&&m.fy===fy&&m.tx===tx&&m.ty===ty){
        return realMove(st,m);
      }
    }
  }else if(type==='enterHole'){
    return realMove(st,{type:'enterHole',fx:fx,fy:fy});
  }else if(type==='sacrifice'){
    var moves=getMoves(st, st.human);
    for(var i=0;i<moves.length;i++){
      var m=moves[i];
      if(m.type!=='sacrifice')continue;
      if(m.fromHole){
        if(m.tx===tx&&m.ty===ty)return realMove(st,m);
      }else if(m.fx===fx&&m.fy===fy&&m.tx===tx&&m.ty===ty){
        return realMove(st,m);
      }
    }
  }else if(type==='exitHole'){
    var moves=getMoves(st, st.human);
    for(var i=0;i<moves.length;i++){
      var m=moves[i];
      if(m.type==='exitHole'&&m.tx===tx&&m.ty===ty){
        return realMove(st,m);
      }
    }
  }
};

function afterHumanMove(op){
  sel=null;hints=[];
  var w=checkWin(G);
  if(w){endGame(w);render();return;}
  render();
  if(netActive()){
    if(op)NET.session.sendOp(op);
    toast('对方思考中...');
    return;
  }
  // AI turn
  aiThinking=true;render();
  setTimeout(function(){
    var m=aiChoose(G);
    if(m){
      realMove(G,m);
      aiPrevMove=m; // remember for anti-oscillation
    }
    aiThinking=false;
    var w2=checkWin(G);
    if(w2)endGame(w2);
    render();
  },600);
}

function endGame(w){
  G.over=true;
  G.winner=w;
  var t=document.getElementById('ov-text');
  var foe=netActive()?'对方':'小miu';
  if(w==='draw')t.textContent='和棋！';
  else if(w===myColor())t.textContent='你赢了！🎉';
  else t.textContent=foe+'赢了！';
  document.getElementById('overlay').classList.add('show');
}

function newGame(){
  G=newState();
  sel=null;hints=[];aiThinking=false;aiPrevMove=null;
  uiLastMove=null;uiAnimateMove=null;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('cap-human').innerHTML='';
  document.getElementById('cap-ai').innerHTML='';
  render();
}

document.getElementById('btn-new').addEventListener('click',function(){
  if(netActive()){
    if(NET.role==='host'){doRematch();}
    else toast('等房主开新局');
    return;
  }
  newGame();
});
document.getElementById('btn-again').addEventListener('click',doRematch);
document.getElementById('btn-agree').addEventListener('click',doRematch);
document.getElementById('btn-share').addEventListener('click',function(){
  copyText(gameSummary(G));
});
function copyText(txt){
  var ok=function(){toast(netActive()?'战绩已复制':'战绩已复制，发给小miu复盘吧');};
  function legacy(){
    var ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');ok();}
    catch(e){toast('复制失败，请手动复制');}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,legacy);}
  else{legacy();}
}
// Delegated click: make empty intersections clickable (cards have no div there)
document.getElementById('board').addEventListener('click',function(e){
  var t=e.target;
  if(t&&t.closest&&t.closest('.card,.hole-zone'))return; // handled by their own listeners
  var r=this.getBoundingClientRect();
  if(!r.width||!r.height)return;
  var gx=Math.round((e.clientX-r.left)/r.width*(COLS-1));
  var gy=Math.round((e.clientY-r.top)/r.height*(ROWS-1));
  gx=Math.max(0,Math.min(COLS-1,gx));
  gy=Math.max(0,Math.min(ROWS-1,gy));
  onTap(gx,gy);
});
if(typeof Netplay!=='undefined'){
  Netplay.chooseMode(function(mode){
    if(mode==='ai'){NET.mode='ai';newGame();}
    else netLobby();
  });
}else newGame();
